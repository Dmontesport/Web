<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --surface-2: #f0f0ed;
    --ink: #18181b;
    --muted: #71717a;
    --line: #e6e6e2;
    --accent: #1438b0;
    --accent-soft: #e7ecfa;
    --accent-ink: #1438b0;
    --ok: #15803d;
    --ok-bg: #e8f5ec;
    --warn: #b91c1c;
    --warn-bg: #fdeceb;
    --none: #8a8a8f;
    --none-bg: #f0f0ed;
    --info-bg: #eef2fc;
    --img-bg: #ffffff;
    --scrim: rgba(17, 17, 20, .38);
    --shadow: 0 1px 2px rgba(17, 17, 20, .04), 0 2px 10px rgba(17, 17, 20, .04);
    --shadow-lg: 0 24px 60px rgba(17, 17, 20, .18);
    --c-cost: #e0901a;
    --c-income: #16a34a;
    --c-net: #1438b0;
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f11; --surface: #18181b; --surface-2: #232328; --ink: #f4f4f5; --muted: #a1a1aa; --line: #2b2b31;
      --accent: #3d63e6; --accent-soft: #18224a; --accent-ink: #8ea8ff; --ok: #4ade80; --ok-bg: #11301d; --warn: #f87171; --warn-bg: #3a1616;
      --none: #a1a1aa; --none-bg: #26262b; --info-bg: #141b38; --img-bg: #f7f7f5; --scrim: rgba(0, 0, 0, .6);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .55);
      --c-cost: #f0a63a; --c-income: #4ade80; --c-net: #8ea8ff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f11; --surface: #18181b; --surface-2: #232328; --ink: #f4f4f5; --muted: #a1a1aa; --line: #2b2b31;
    --accent: #3d63e6; --accent-soft: #18224a; --accent-ink: #8ea8ff; --ok: #4ade80; --ok-bg: #11301d; --warn: #f87171; --warn-bg: #3a1616;
    --none: #a1a1aa; --none-bg: #26262b; --info-bg: #141b38; --img-bg: #f7f7f5; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .55);
    --c-cost: #f0a63a; --c-income: #4ade80; --c-net: #8ea8ff; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

wvFcXWrzaumd9O3hAAAA///E4QjpAAAABklEQVQDAEFm87rNtQtIAAAAAElFTkSuQmCC); width: 40px; height: 28px; flex: none; background: var(--ink); -webkit-mask: var(--mark) center / contain no-repeat; mask: var(--mark) center / contain no-repeat; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
  header h1 span { color: var(--muted); font-weight: 450; }
  .search-wrap { flex: 1; max-width: 440px; margin-left: auto; position: relative; display: flex; align-items: center; }
  .search-wrap svg { position: absolute; left: 12px; color: var(--muted); pointer-events: none; width: 16px; height: 16px; }
  .search { width: 100%; padding: 9px 14px 9px 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); transition: border-color .15s, background .15s; }
  .search:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .actions { display: flex; align-items: center; gap: 6px; }
  .hbtn { display: inline-flex; align-items: center; gap: 7px; background: transparent; color: var(--ink); border: 1px solid transparent; border-radius: 10px; padding: 8px 11px; white-space: nowrap; font-size: 14px; font-weight: 500; transition: background .15s, border-color .15s; }
  .hbtn:hover { background: var(--surface-2); }
  .hbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .hbtn.icon { padding: 8px; }
  .cart-btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; margin-left: 4px; transition: filter .15s; }
  .cart-btn:hover { filter: brightness(1.06); }
  .cart-btn .count { background: rgba(255, 255, 255, .24); border-radius: 999px; min-width: 22px; padding: 0 7px; text-align: center; font-size: 12.5px; line-height: 20px; }

  .manage-bar { display: none; background: var(--info-bg); border-bottom: 1px solid var(--line); padding: 10px 28px; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  body.manage .manage-bar { display: flex; }
  .manage-bar .pending { margin-right: auto; color: var(--accent-ink); }
  .manage-bar .pending b { color: var(--warn); }

  .filters { padding: 22px 28px 4px; display: grid; gap: 12px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .filter-row .label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); width: 120px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 12px; border-radius: 999px; font-size: 13.5px; white-space: nowrap; transition: border-color .15s, background .15s; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .chip .n { color: var(--muted); font-size: 11.5px; margin-left: 5px; }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .6; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  .result-count { padding: 10px 28px 0; color: var(--muted); font-size: 13px; }

  .grid { padding: 12px 28px 48px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; position: relative; transition: box-shadow .2s, transform .2s, border-color .2s; }
  .card:hover { box-shadow: var(--shadow), 0 10px 28px rgba(17, 17, 20, .07); transform: translateY(-2px); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .pic { background: var(--img-bg); aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; cursor: zoom-in; border: 0; padding: 14px; margin: 6px 6px 0; border-radius: 10px; }
  .card .pic img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .noimg { color: var(--muted); font-size: 13px; }
  .card .body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .model { font-weight: 650; font-size: 15.5px; letter-spacing: -.01em; }
  .name { color: var(--muted); font-size: 13.5px; margin-top: -4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 11px; background: var(--surface-2); border-radius: 6px; padding: 2px 7px; color: var(--muted); }
  .tag.flag { background: var(--accent-soft); color: var(--accent-ink); }
  .specs { font-size: 12px; color: var(--muted); }
  .card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 8px; gap: 8px; }
  .stock { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .stock.in { color: var(--ok); background: var(--ok-bg); }
  .stock.out { color: var(--none); background: var(--none-bg); }
  .add { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 500; transition: border-color .15s, background .15s; }
  .add:hover { border-color: var(--ink); }
  .add.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .edit-btn { display: none; position: absolute; top: 12px; right: 12px; background: var(--ink); color: var(--surface); border: 0; border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 500; z-index: 1; }
  body.manage .edit-btn { display: block; }
  .edited { position: absolute; top: 12px; left: 12px; font-size: 11px; font-weight: 600; background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 8px; z-index: 1; }
  .empty { padding: 48px 24px; color: var(--muted); text-align: center; grid-column: 1 / -1; }
  #sentinel { height: 1px; }

  .scrim { position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 20; display: none; }
  .scrim.open { display: block; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 21; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .25s cubic-bezier(.2, .8, .2, 1); box-shadow: var(--shadow-lg); }
  .drawer.open { transform: none; }
  .drawer-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .drawer-head h2 { margin: 0; font-size: 17px; font-weight: 650; flex: 1; }
  .icon-btn { border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 9px; color: var(--muted); border-radius: 8px; }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  .summary div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .summary b { display: block; font-size: 20px; font-weight: 650; }
  .summary span { font-size: 12px; color: var(--muted); }
  .summary .bad b { color: var(--warn); }
  .lines { flex: 1; overflow: auto; padding: 4px 22px; }
  .line { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .line-top { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; }
  .line img { width: 64px; height: 48px; object-fit: contain; background: var(--img-bg); border: 1px solid var(--line); border-radius: 8px; }
  .line .model { font-size: 15px; }
  .qty { display: flex; align-items: center; gap: 4px; }
  .qty button { width: 30px; height: 30px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; }
  .qty button:hover { border-color: var(--muted); }
  .qty input { width: 52px; height: 30px; text-align: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .line-stock { display: flex; align-items: center; gap: 8px; margin: 8px 0 0 76px; font-size: 13px; flex-wrap: wrap; }
  .status { font-weight: 600; padding: 2px 9px; border-radius: 999px; font-size: 12px; }
  .status.ok { color: var(--ok); background: var(--ok-bg); }
  .status.short, .status.none { color: var(--warn); background: var(--warn-bg); }
  .link { border: 0; background: none; color: var(--accent-ink); padding: 0; font-size: 13px; font-weight: 500; text-decoration: none; }
  .link:hover { text-decoration: underline; }
  .remove { margin-left: auto; color: var(--muted); }
  .variants { margin: 8px 0 0 76px; display: grid; gap: 6px; }
  .variant { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; font-size: 13px; background: var(--surface-2); border-radius: 10px; padding: 6px 8px; }
  .variant img { width: 48px; height: 36px; object-fit: contain; border: 0; background: var(--img-bg); border-radius: 6px; }
  .variant .vq { font-weight: 700; padding-right: 4px; }
  .variant .note { color: var(--muted); font-size: 12px; }
  .drawer-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 500; transition: border-color .15s, background .15s, filter .15s; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover, .btn.accent:hover { filter: brightness(1.12); }
  .btn.danger { border-color: transparent; color: var(--warn); background: var(--warn-bg); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn.small { padding: 5px 11px; font-size: 13px; border-radius: 8px; }

  .modal { position: fixed; z-index: 22; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; background: var(--scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .modal.open { display: flex; }
  .modal-box { background: var(--surface); border-radius: 18px; width: min(900px, 100%); max-height: 92vh; overflow: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--line); }
  .modal-box.wide { width: min(1040px, 100%); }
  .detail { display: grid; grid-template-columns: 1.1fr 1fr; }
  .detail .big { background: var(--img-bg); display: flex; align-items: center; justify-content: center; padding: 24px; min-height: 280px; }
  .detail .big img { max-width: 100%; max-height: 60vh; object-fit: contain; }
  .detail .info { padding: 24px; display: flex; flex-direction: column; gap: 10px; position: relative; }
  .detail .info > .icon-btn { position: absolute; top: 12px; right: 12px; }
  .detail h3 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.015em; }
  .detail table { border-collapse: collapse; font-size: 14px; }
  .detail td { padding: 4px 14px 4px 0; vertical-align: top; }
  .detail td:first-child { color: var(--muted); white-space: nowrap; }
  .detail h4, .form h4 { margin: 10px 0 0; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .detail ul { margin: 0; padding-left: 18px; font-size: 14px; }

  .form { padding: 22px 26px; display: grid; gap: 14px; }
  .form-head { display: flex; align-items: center; gap: 12px; }
  .form-head h3 { margin: 0; flex: 1; font-size: 19px; font-weight: 650; }
  .fgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .f { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); }
  .f.span2 { grid-column: span 2; } .f.span4 { grid-column: 1 / -1; }
  .f input, .f select, .f textarea { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; color: var(--ink); background: var(--surface); font-size: 14px; }
  .f input:focus, .f textarea:focus, .vtable input:focus, .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .f textarea { min-height: 80px; resize: vertical; }
  .img-edit { display: flex; gap: 14px; align-items: center; }
  .img-edit .preview { width: 180px; height: 135px; border: 1px dashed var(--line); border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--img-bg); overflow: hidden; }
  .img-edit .preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .funcs { display: flex; flex-wrap: wrap; gap: 6px; }
  .funcs label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink); background: var(--surface-2); padding: 3px 10px; border-radius: 999px; }
  .funcs input { accent-color: var(--accent); }
  .vtable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .vtable th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px; }
  .vtable td { padding: 4px; vertical-align: middle; }
  .vtable input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); }
  .vtable .vimg { width: 52px; height: 40px; border: 1px dashed var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--img-bg); overflow: hidden; cursor: pointer; font-size: 11px; color: #8a8a8f; }
  .vtable .vimg img { max-width: 100%; max-height: 100%; }
  .form-foot { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
  .form-foot .spacer { flex: 1; }
  .err { color: var(--warn); font-size: 13px; }

  /* ---------- Calculator ---------- */
  .calc { padding: 22px 26px 26px; display: grid; gap: 20px; }
  .calc-head { display: flex; align-items: flex-start; gap: 12px; }
  .calc-head h3 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
  .calc-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .calc-head .icon-btn { margin-left: auto; }
  .calc-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
  .calc-params { display: grid; gap: 16px; }
  .calc-label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; margin-top: 8px; }
  .seg button { border: 0; background: transparent; border-radius: 8px; padding: 7px 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .calc-group { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; margin: 0; display: grid; gap: 12px; min-width: 0; }
  .calc-group legend { padding: 0 6px; margin-left: -6px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .field { display: grid; gap: 5px; font-size: 12.5px; color: var(--muted); }
  .field .in { position: relative; display: flex; align-items: center; }
  .field input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 74px 8px 11px; background: var(--surface); color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
  .field .unit { position: absolute; right: 11px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .calc-results { display: grid; gap: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; display: grid; gap: 4px; min-width: 0; }
  .kpi .k-lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .kpi .k-val { font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.25; }
  .kpi .k-desc { font-size: 11.5px; color: var(--muted); }
  .kpi.net .k-val.pos { color: var(--ok); }
  .kpi.net .k-val.neg { color: var(--warn); }
  .calc-aux { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; background: var(--surface-2); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: var(--muted); }
  .calc-aux b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bars { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 16px; }
  .bars-title { font-size: 13px; font-weight: 600; }
  .bar-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13px; }
  .bar-row .b-val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar-track { grid-column: 1 / -1; position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar-track .bar { position: absolute; top: 0; bottom: 0; border-radius: 999px; transition: left .3s ease, width .3s ease; }
  .bar-track .zero { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .5; }

  .swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px 16px; }
  .swatch { border: 0; background: none; padding: 0; display: grid; gap: 2px; text-align: center; color: var(--ink); }
  .swatch img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 8px; display: block; transition: transform .15s, box-shadow .15s; }
  .swatch:hover img { transform: translateY(-2px); box-shadow: var(--shadow), 0 8px 20px rgba(17, 17, 20, .12); }
  .swatch b { font-size: 14px; font-weight: 600; }
  .swatch span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .lock { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: grid; place-items: center; padding: 24px 16px; overflow: auto; }
  .lock form { width: min(360px, 100%); display: grid; gap: 14px; text-align: center; }
  .lock .logo { width: 92px; height: 64px; justify-self: center; }
  .lock h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  .lock h2 span { color: var(--muted); font-weight: 450; }
  .lock p { margin: -6px 0 4px; color: var(--muted); font-size: 14px; }
  .lock input[type="password"] { border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; background: var(--surface); color: var(--ink); font-size: 16px; }
  .lock input[type="password"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .lock .toggle { justify-content: center; color: var(--muted); }
  .lock .btn { padding: 11px 14px; font-size: 15px; }
  .lock .err { min-height: 20px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; z-index: 40; display: none; max-width: 90vw; font-size: 14px; box-shadow: var(--shadow-lg); }
  .toast.show { display: block; }

  .print-only { display: none; }

  @media (max-width: 860px) {
    .calc-body { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    header { flex-wrap: wrap; padding: 10px 16px; gap: 8px; }
    .brand { gap: 8px; }
    .logo { width: 34px; height: 24px; }
    .actions { margin-left: auto; gap: 2px; }
    .hbtn .lbl, .cart-btn .lbl { display: none; }
    .hbtn { padding: 7px; }
    .cart-btn { padding: 7px 8px; margin-left: 2px; }
    .search-wrap { order: 5; max-width: none; flex-basis: 100%; }
    .filters, .grid, .result-count, .manage-bar { padding-left: 16px; padding-right: 16px; }
    .filters { padding-top: 16px; gap: 10px; }
    .filter-row .label { width: 100%; }
    .filter-row.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
    .filter-row.scroll::-webkit-scrollbar { display: none; }
    .filter-row.scroll .label { width: auto; white-space: nowrap; margin-right: 4px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card .pic { padding: 8px; }
    .card .body { padding: 10px 12px 12px; }
    .card .tags .tag:nth-child(n+3) { display: none; }
    .card .foot { flex-wrap: wrap; }
    .detail { grid-template-columns: 1fr; }
    .detail .big { min-height: 200px; }
    .variants, .line-stock { margin-left: 0; }
    .fgrid { grid-template-columns: 1fr 1fr; }
    .form, .calc { padding: 18px 16px; }
    .modal { padding: 0; align-items: flex-end; }
    .modal-box, .modal-box.wide { max-height: 94vh; border-radius: 18px 18px 0 0; }
    .swatches { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; }
    /* Calculator on phones: results pinned at the top, inputs in two columns */
    .calc { gap: 12px; }
    .calc-head p { display: none; }
    .calc-body { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
    .calc-results { display: contents; }
    .kpis { order: -1; position: sticky; top: 0; z-index: 2; background: var(--surface); margin: 0 -16px; padding: 6px 16px 10px; gap: 6px; border-bottom: 1px solid var(--line); }
    .kpi { padding: 8px 10px; gap: 2px; border-radius: 10px; align-content: start; }
    .kpi .k-lbl { font-size: 11px; gap: 5px; line-height: 1.25; }
    .kpi .k-val { font-size: 15px; }
    .kpi .k-desc { display: none; }
    .calc-params { gap: 12px; }
    .seg { margin-top: 6px; }
    .calc-group { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 10px 12px 12px; }
    .calc-group .hint { grid-column: 1 / -1; font-size: 11px; }
    .field { font-size: 12px; gap: 4px; }
    .field input { padding: 8px 52px 8px 10px; font-size: 16px; }
    .field .unit { right: 8px; font-size: 11px; }
    .calc-aux { font-size: 12px; padding: 8px 12px; }
    .bars { padding: 12px; gap: 12px; }
  }
  @media (max-width: 400px) {
    header h1 span { display: none; }
  }

  @media print {
    body { background: #fff; color: #000; }
    header, .manage-bar, .filters, .result-count, .grid, .scrim, .modal, .drawer, .toast { display: none !important; }
    .print-only { display: block; }
    .print-only h1 { font-size: 20px; margin: 0 0 4px; }
    .print-only .meta { color: #555; font-size: 12px; margin-bottom: 12px; }
    .print-only table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .print-only th, .print-only td { border-bottom: 1px solid #ccc; padding: 6px; text-align: left; vertical-align: top; }
    .print-only th { background: #f0f0f0; }
    .print-only img { width: 70px; height: 52px; object-fit: contain; }
    .print-only .short { color: #b42318; font-weight: 700; }
    .print-only .v { color: #555; font-size: 11px; }
    .print-only tr { break-inside: avoid; }
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="logo" role="img" aria-label="Logotipo de D'Monte"></span><h1>D'Monte <span>Equipamiento</span></h1></div>
  <label class="search-wrap"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="search" id="search" type="search" placeholder="Buscar modelo, nombre, músculo…"></label>
  <div class="actions">
    <button class="hbtn" id="calcBtn" title="Calculadora de rentabilidad"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7h7M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15v2.5M8.5 17.5h.01M12 17.5h.01"/></svg><span class="lbl">Calculadora</span></button>
    <button class="hbtn" id="cushionBtn" title="Colores de tapizado"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span class="lbl">Tapizados</span></button>
    <button class="hbtn" id="manageBtn" aria-pressed="false" title="Gestionar"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg><span class="lbl">Gestionar</span></button>
    <button class="hbtn icon" id="themeBtn" title="Tema claro / oscuro"></button>
    <button class="cart-btn" id="openCart"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9L5 7Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg><span class="lbl">Selección</span> <span class="count" id="cartCount">0</span></button>
  </div>
</header>

<div class="manage-bar">
  <span class="pending" id="pending"></span>
  <button class="btn accent small" id="addBtn">+ Añadir máquina</button>
  <button class="btn primary small" id="saveFolder" title="Escribe data.js en la carpeta Catalogo_Web (Chrome / Edge)">Guardar en carpeta</button>
  <button class="btn small" id="downloadData">Descargar data.js</button>
  <button class="btn small" id="buildWeb" title="Crea la versión con contraseña para publicar en GitHub Pages">Generar web cifrada</button>
  <button class="btn ghost small" id="forgetKey" hidden>Olvidar contraseña en este dispositivo</button>
  <button class="btn small" id="exportBackup">Exportar copia</button>
  <label class="btn small" style="cursor:pointer" title="El archivo dmonte_backup_….json creado con “Exportar copia”">Importar copia (.json)<input type="file" id="importBackup" accept=".json,application/json" hidden></label>
  <button class="btn ghost small" id="discardAll">Descartar cambios locales</button>
</div>

<section class="filters">
  <div class="filter-row scroll" id="groupRow"></div>
  <div class="filter-row scroll" id="funcRow"></div>
  <div class="filter-row">
    <span class="label">Stock</span>
    <label class="toggle"><input type="checkbox" id="onlyStock"> Solo con stock</label>
  </div>
</section>
<div class="result-count" id="resultCount"></div>
<main class="grid" id="grid"></main>
<div id="sentinel"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Selección">
  <div class="drawer-head">
    <h2>Selección</h2>
    <button class="icon-btn" id="closeCart" aria-label="Cerrar">×</button>
  </div>
  <div class="summary" id="summary"></div>
  <div class="lines" id="lines"></div>
  <div class="drawer-foot">
    <button class="btn primary" id="exportCsv">Exportar a Excel (CSV)</button>
    <button class="btn" id="printBtn">Imprimir / PDF</button>
    <button class="btn ghost" id="clearCart" style="margin-left:auto">Vaciar</button>
  </div>
</aside>

<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<section class="print-only" id="printView"></section>

<script src="data.enc.js"></script>
<script>
// ===========================================================================
// Data: data.js (generated from CATALOGO.pdf + the inventory Excel) holds
//   { products: [...], stock: { ID: [variants] } }
// Changes made in "Manage" mode are kept in this browser (IndexedDB) until
// "Save to folder" / "Download data.js" writes a new data.js.
// ===========================================================================
const BASE = window.CATALOG_DATA || { products: [], stock: {} };
const GROUP_ORDER = ["Upper body", "Lower body", "Core", "Full body", "Cardio", "Functional training", "Accessories", "Unclassified"];
const STD_FUNCS = ["Chest", "Back", "Shoulders", "Biceps", "Triceps", "Arms", "Quads", "Hamstrings", "Glutes & hip",
  "Adductors / abductors", "Calves", "Abs", "Obliques", "Lower back", "Cable / pulley", "Multi-station",
  "Squat / smith / rack", "Bench", "Treadmill", "Bike", "Elliptical", "Rower", "Stair climber",
  "Sprint / resistance", "Free weights", "Storage", "Smart / digital", "Other"];
const PAGE = 60;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const normId = s => String(s || "").toUpperCase().replace(/\s+/g, "");
const clone = o => JSON.parse(JSON.stringify(o));
// Spanish labels for the English group / function / section values stored in data.js
const ES = {
  "Upper body": "Tren superior", "Lower body": "Tren inferior", "Core": "Core", "Full body": "Cuerpo completo", "Cardio": "Cardio",
  "Functional training": "Entrenamiento funcional", "Accessories": "Accesorios", "Unclassified": "Sin clasificar",
  "Customize": "Personalizado", "Multi-functional": "Multifuncional", "Nutrition": "Nutrición", "Smart": "Inteligente", "Strength": "Fuerza", "Track and Field": "Atletismo",
  "Chest": "Pecho", "Back": "Espalda", "Shoulders": "Hombros", "Biceps": "Bíceps", "Triceps": "Tríceps", "Arms": "Brazos", "Quads": "Cuádriceps",
  "Hamstrings": "Isquiotibiales", "Glutes & hip": "Glúteos y cadera", "Adductors / abductors": "Aductores / abductores", "Calves": "Gemelos",
  "Abs": "Abdominales", "Obliques": "Oblicuos", "Lower back": "Zona lumbar", "Cable / pulley": "Cable / polea", "Multi-station": "Multiestación",
  "Squat / smith / rack": "Sentadilla / multipower / rack", "Bench": "Banco", "Treadmill": "Cinta de correr", "Bike": "Bicicleta", "Elliptical": "Elíptica",
  "Rower": "Remo", "Stair climber": "Escaladora", "Sprint / resistance": "Sprint / resistencia", "Free weights": "Peso libre", "Storage": "Almacenaje",
  "Smart / digital": "Inteligente / digital", "Other": "Otros",
};
const ES_REV = Object.fromEntries(Object.entries(ES).map(([k, v]) => [v.toLowerCase(), k]));
const tr = s => ES[s] || s;
const unTr = s => ES_REV[String(s).toLowerCase()] || s;
const fold = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

// ---------- IndexedDB (local edits) ----------
const idb = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open("dmonte", 1);
        r.onupgradeneeded = () => { r.result.createObjectStore("overrides"); r.result.createObjectStore("meta"); };
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch { res(); }
    });
  },
  tx(store, mode, fn) {
    return new Promise(res => {
      if (!this.db) return res(null);
      try {
        const t = this.db.transaction(store, mode), s = t.objectStore(store);
        const out = fn(s);
        t.oncomplete = () => res(out && "result" in out ? out.result : null);
        t.onerror = () => res(null);
      } catch { res(null); }
    });
  },
  all() {
    return new Promise(res => {
      if (!this.db) return res({});
      const out = {};
      try {
        const c = this.db.transaction("overrides").objectStore("overrides").openCursor();
        c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } else res(out); };
        c.onerror = () => res(out);
      } catch { res(out); }
    });
  },
  put(id, v) { return this.tx("overrides", "readwrite", s => s.put(v, id)); },
  del(id) { return this.tx("overrides", "readwrite", s => s.delete(id)); },
  clear() { return this.tx("overrides", "readwrite", s => s.clear()); },
  getMeta(k) { return this.tx("meta", "readonly", s => s.get(k)); },
  setMeta(k, v) { return this.tx("meta", "readwrite", s => s.put(v, k)); },
};

// ---------- State ----------
let PRODUCTS = [], STOCK = {}, byId = {}, OVERRIDES = {};
const state = { group: null, func: null, q: "", onlyStock: false, cart: loadCart(), open: new Set(), shown: PAGE, manage: false };

function rebuild() {
  const prods = BASE.products.map(clone);
  const stock = clone(BASE.stock || {});
  const idx = Object.fromEntries(prods.map((p, i) => [p.id, i]));
  for (const [id, o] of Object.entries(OVERRIDES)) {
    if (o.deleted) { if (id in idx) prods[idx[id]] = null; delete stock[id]; continue; }
    if (id in idx) prods[idx[id]] = o.product; else prods.push(o.product);
    stock[id] = o.stock || [];
  }
  PRODUCTS = prods.filter(Boolean);
  STOCK = stock;
  byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
}
const stockOf = id => (STOCK[id] || []).reduce((s, v) => s + (+v.qty || 0), 0);

function loadCart() { try { return JSON.parse(localStorage.getItem("dmonte-selection") || "{}") || {}; } catch { return {}; } }
function saveCart() { try { localStorage.setItem("dmonte-selection", JSON.stringify(state.cart)); } catch {} }

function toast(msg, ms = 3000) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), ms);
}

// ---------- Filters ----------
function matches(p, { group = state.group, func = state.func } = {}) {
  if (group && p.group !== group) return false;
  if (func && !(p.functions || []).includes(func)) return false;
  if (state.onlyStock && stockOf(p.id) === 0) return false;
  if (state.q) {
    const hay = fold([p.model, p.name, p.name_cn, p.section, p.group, tr(p.section), tr(p.group), ...(p.functions || []), ...(p.functions || []).map(tr)].join(" "));
    if (!fold(state.q).split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

function renderFilters() {
  const groups = [...GROUP_ORDER.filter(g => PRODUCTS.some(p => p.group === g)),
    ...[...new Set(PRODUCTS.map(p => p.group))].filter(g => g && !GROUP_ORDER.includes(g))];
  const gRow = $("groupRow");
  gRow.innerHTML = '<span class="label">Grupo muscular</span>';
  gRow.append(chip("Todos", null, state.group === null, PRODUCTS.filter(p => matches(p, { group: null, func: null })).length, v => { state.group = v; state.func = null; }));
  groups.forEach(g => gRow.append(chip(tr(g), g, state.group === g, PRODUCTS.filter(p => matches(p, { group: g, func: null })).length, v => { state.group = v; state.func = null; })));

  const funcs = [...new Set(PRODUCTS.filter(p => !state.group || p.group === state.group).flatMap(p => p.functions || []))].sort((a, b) => tr(a).localeCompare(tr(b), "es"));
  const fRow = $("funcRow");
  fRow.innerHTML = '<span class="label">Función principal</span>';
  fRow.append(chip("Todas", null, state.func === null, null, v => { state.func = v; }));
  funcs.forEach(f => {
    const n = PRODUCTS.filter(p => matches(p, { func: f })).length;
    if (n || state.func === f) fRow.append(chip(tr(f), f, state.func === f, n, v => { state.func = v; }));
  });
}

function chip(label, value, pressed, n, onPick) {
  const b = document.createElement("button");
  b.className = "chip";
  b.setAttribute("aria-pressed", pressed);
  b.innerHTML = esc(label) + (n === null ? "" : `<span class="n">${n}</span>`);
  b.onclick = () => { onPick(value); state.shown = PAGE; render(); };
  return b;
}

// ---------- Grid ----------
function stockBadge(id) {
  const s = stockOf(id);
  return s > 0 ? `<span class="stock in">${s} en stock</span>` : `<span class="stock out">Sin stock</span>`;
}
function dimsText(p) {
  const d = p.dims || {};
  const parts = [];
  if (d.l || d.w || d.h) parts.push(`${d.l || "?"}×${d.w || "?"}×${d.h || "?"} mm`);
  if (p.weight) parts.push(`${String(p.weight).replace(".", ",")} kg`);
  return parts.join(" · ");
}
const picHtml = p => p.img ? `<img ${imgAttr(p.img)} alt="${esc(p.name)}" loading="lazy">` : `<span class="noimg">Sin imagen</span>`;

function renderGrid() {
  const list = PRODUCTS.filter(p => matches(p));
  $("resultCount").textContent = `${list.length} de ${PRODUCTS.length} máquinas`;
  const grid = $("grid");
  if (!list.length) { grid.innerHTML = '<div class="empty">Ninguna máquina coincide con estos filtros.</div>'; return; }
  grid.innerHTML = list.slice(0, state.shown).map(p => {
    const sel = p.id in state.cart;
    return `
    <article class="card ${sel ? "selected" : ""}">
      ${OVERRIDES[p.id] ? '<span class="edited">editada</span>' : ""}
      <button class="edit-btn" data-edit="${esc(p.id)}">Editar</button>
      <button class="pic" data-detail="${esc(p.id)}" aria-label="Ver ${esc(p.model)}">${picHtml(p)}</button>
      <div class="body">
        <div class="model">${esc(p.model)}</div>
        <div class="name">${esc(p.name) || "&nbsp;"}</div>
        <div class="tags">
          ${p.group ? `<span class="tag">${esc(tr(p.group))}</span>` : ""}
          ${(p.functions || []).map(f => `<span class="tag">${esc(tr(f))}</span>`).join("")}
          ${p.inCatalog === false ? '<span class="tag flag">No está en catálogo</span>' : ""}
        </div>
        <div class="specs">${esc(dimsText(p))}</div>
        <div class="foot">
          ${stockBadge(p.id)}
          <button class="add ${sel ? "on" : ""}" data-toggle="${esc(p.id)}">${sel ? "✓ Añadida" : "+ Añadir"}</button>
        </div>
      </div>
    </article>`;
  }).join("");
}
new IntersectionObserver(es => {
  if (es[0].isIntersecting && state.shown < PRODUCTS.filter(p => matches(p)).length) { state.shown += PAGE; renderGrid(); }
}, { rootMargin: "600px" }).observe($("sentinel"));

// ---------- Selection ----------
function toggleCart(id) {
  if (id in state.cart) delete state.cart[id]; else state.cart[id] = 1;
  saveCart(); renderGrid(); renderCart();
}
function setQty(id, q) { state.cart[id] = Math.max(1, Math.min(999, parseInt(q, 10) || 1)); saveCart(); renderCart(); }
function lineStatus(id, want) {
  const s = stockOf(id);
  if (s === 0) return { cls: "none", text: "Sin stock", short: want };
  if (want > s) return { cls: "short", text: `⚠ Faltan ${want - s}`, short: want - s };
  return { cls: "ok", text: "✓ Disponible", short: 0 };
}
function variantRow(v) {
  const note = [v.code && "Código " + v.code, v.batch, v.remark].filter(Boolean).map(esc).join(" · ");
  return `<div class="variant">${v.img ? `<img ${imgAttr(v.img)} alt="">` : "<span></span>"}<div>${esc(v.color) || "Sin notas de color"}${note ? `<div class="note">${note}</div>` : ""}</div><div class="vq">${+v.qty || 0}</div></div>`;
}

function renderCart() {
  const ids = Object.keys(state.cart).filter(id => byId[id]);
  $("cartCount").textContent = ids.length;
  const units = ids.reduce((s, id) => s + state.cart[id], 0);
  const problems = ids.filter(id => lineStatus(id, state.cart[id]).short > 0).length;
  $("summary").innerHTML = `
    <div><b>${ids.length}</b><span>máquinas</span></div>
    <div><b>${units}</b><span>unidades pedidas</span></div>
    <div class="${problems ? "bad" : ""}"><b>${problems}</b><span>con falta / sin stock</span></div>`;
  if (!ids.length) { $("lines").innerHTML = '<div class="empty">Todavía no hay nada seleccionado. Usa “+ Añadir” en cualquier máquina.</div>'; return; }
  $("lines").innerHTML = ids.map(id => {
    const p = byId[id], want = state.cart[id], s = stockOf(id), st = lineStatus(id, want);
    const vars = STOCK[id] || [], open = state.open.has(id);
    return `
    <div class="line">
      <div class="line-top">
        ${p.img ? `<img ${imgAttr(p.img)} alt="">` : "<span></span>"}
        <div><div class="model">${esc(p.model)}</div><div class="name" style="margin:0">${esc(p.name)}</div></div>
        <div class="qty">
          <button data-dec="${esc(id)}" aria-label="Menos">−</button>
          <input data-qty="${esc(id)}" type="number" min="1" value="${want}" aria-label="Unidades deseadas">
          <button data-inc="${esc(id)}" aria-label="Más">+</button>
        </div>
      </div>
      <div class="line-stock">
        <span>Almacén: <b>${s}</b></span>
        <span class="status ${st.cls}">${st.text}</span>
        ${vars.length ? `<button class="link" data-vars="${esc(id)}">${open ? "Ocultar" : "Ver"} ${vars.length} variante${vars.length > 1 ? "s" : ""}</button>` : ""}
        <button class="link remove" data-toggle="${esc(id)}">Quitar</button>
      </div>
      ${open && vars.length ? `<div class="variants">${vars.map(variantRow).join("")}</div>` : ""}
    </div>`;
  }).join("");
}
function openDrawer(on) { $("drawer").classList.toggle("open", on); $("scrim").classList.toggle("open", on); }

// ---------- Editor ----------

  const isNew = !id;
  draft = {
    id, isNew,
    product: isNew ? { id: "", model: "", name: "", name_cn: "", section: "", group: "", functions: [], dims: { l: null, w: null, h: null }, weight: null, features: [], img: "", page: null, inCatalog: false }
                   : clone(byId[id]),
    stock: isNew ? [] : clone(STOCK[id] || []),
  };
  renderEditor();
  $("modal").classList.add("open");
}

// Keep typed values in the draft before re-rendering (e.g. when adding a stock row)
function readForm() {
  const f = $("editForm"); if (!f) return;
  const g = n => f.elements[n].value.trim();
  const num = n => g(n) === "" ? null : Number(g(n));
  const p = draft.product;
  p.model = g("model"); p.name = g("name"); p.name_cn = g("name_cn"); p.section = unTr(g("section")); p.group = unTr(g("group"));
  p.page = num("page"); p.weight = num("weight"); p.dims = { l: num("l"), w: num("w"), h: num("h") };
  p.functions = [...f.querySelectorAll('input[name="func"]:checked')].map(i => i.value)
    .concat(g("funcExtra").split(",").map(s => s.trim()).filter(Boolean));
  p.features = f.elements.features.value.split("\n").map(s => s.trim()).filter(Boolean);
  f.querySelectorAll("[data-v]").forEach(i => {
    const v = draft.stock[i.dataset.v];
    v[i.dataset.k] = i.dataset.k === "qty" ? Math.max(0, parseInt(i.value, 10) || 0) : i.value.trim();
  });
}

async function saveDraft() {
  readForm();
  const p = draft.product;
  if (!p.model) return renderEditor("El modelo es obligatorio.");
  const newId = draft.isNew ? normId(p.model) : draft.id;
  if (draft.isNew && byId[newId]) return renderEditor(`Ya existe una máquina con el modelo ${p.model}.`);
  p.id = newId;
  p.functions = [...new Set(p.functions)];
  const rec = { product: p, stock: draft.stock, updated: new Date().toISOString() };
  OVERRIDES[newId] = rec;
  await idb.put(newId, rec);
  rebuild(); closeModal(); render();
  toast(`${p.model} guardada en este navegador. Usa “Guardar en carpeta” para hacerlo permanente.`);
}

async function deleteMachine() {
  if (!confirm(`¿Eliminar ${draft.product.model}?`)) return;
  const id = draft.id;
  if (BASE.products.some(b => b.id === id)) { OVERRIDES[id] = { deleted: true }; await idb.put(id, OVERRIDES[id]); }
  else { delete OVERRIDES[id]; await idb.del(id); }
  delete state.cart[id]; saveCart();
  rebuild(); closeModal(); render();
  toast("Máquina eliminada.");
}

async function revertMachine() {
  delete OVERRIDES[draft.id]; await idb.del(draft.id);
  rebuild(); closeModal(); render();
  toast("Se han restaurado los datos originales.");
}

function resizeImage(file, max = 900) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.85));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function pendingCount() { return Object.keys(OVERRIDES).length; }
function renderPending() {
  const n = pendingCount();
  if (window.SINGLE_FILE || window.DMONTE_ENC) {
    $("pending").innerHTML = n ? `<b>${n}</b> cambio${n > 1 ? "s" : ""} guardado${n > 1 ? "s" : ""} en este dispositivo. Usa <b>Exportar copia</b> para pasarlos a otro dispositivo.`
                               : "Los cambios que hagas se guardan en este dispositivo.";
    return;
  }
  $("pending").innerHTML = n ? `<b>${n}</b> cambio${n > 1 ? "s" : ""} guardado${n > 1 ? "s" : ""} solo en este navegador. Usa <b>Guardar en carpeta</b> para hacerlos permanentes.`
                             : "Todos los cambios están guardados en data.js.";
}
function dataJs() {
  const out = { generated: new Date().toISOString().slice(0, 10), products: PRODUCTS, stock: {} };
  PRODUCTS.forEach(p => { if ((STOCK[p.id] || []).length) out.stock[p.id] = STOCK[p.id]; });
  return "window.CATALOG_DATA = " + JSON.stringify(out) + ";\n";
}
async function committed() {
  BASE.products = clone(PRODUCTS); BASE.stock = clone(STOCK);
  OVERRIDES = {}; await idb.clear(); rebuild(); render();
}
// Never write a data.js when the original one did not load: it would replace the catalog with an empty one
function dataLoaded() {
  if (BASE.products.length) return true;
  toast("No se cargó data.js, así que no se ha guardado nada. Abre index.html desde la carpeta que contiene data.js.", 8000);
  return false;
}
async function saveToFolder() {
  if (!dataLoaded()) return;
  if (!window.showDirectoryPicker) {
    toast("Este navegador no puede escribir en carpetas. Usa “Descargar data.js” y sustituye el archivo en Catalogo_Web.", 6000);
    return;
  }
  try {
    let dir = await idb.getMeta("dir");
    if (dir && (await dir.requestPermission({ mode: "readwrite" })) !== "granted") dir = null;
    if (!dir) {
      toast("Elige la carpeta Catalogo_Web (la que contiene index.html).", 5000);
      dir = await window.showDirectoryPicker({ id: "dmonte", mode: "readwrite" });
    }
    try { await dir.getFileHandle("index.html"); }
    catch { toast("Esa carpeta no tiene index.html. Elige la carpeta Catalogo_Web.", 6000); await idb.setMeta("dir", null); return; }
    await idb.setMeta("dir", dir);
    try {   // keep a backup of the previous data.js
      const old = await (await (await dir.getFileHandle("data.js")).getFile()).text();
      const bk = await (await dir.getDirectoryHandle("backups", { create: true })).getFileHandle(`data_${new Date().toISOString().replace(/[:.]/g, "-")}.js`, { create: true });
      const w0 = await bk.createWritable(); await w0.write(old); await w0.close();
    } catch {}
    const fh = await dir.getFileHandle("data.js", { create: true });
    const w = await fh.createWritable(); await w.write(dataJs()); await w.close();
    await committed();
    toast("Guardado en data.js ✓ (la versión anterior queda en /backups)");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    toast("No se pudo guardar en la carpeta: " + (e && e.message || e) + ". Usa “Descargar data.js”.", 7000);
  }
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const CALC_DEFAULTS = { consumo: 0.9, precio_kwh: 0.11, num_ventas: 1, precio_venta: 10, comision_pct: 10, period: "30d" };
const CALC_PERIODS = {
  "1d": { days: 1, label: "1 día", desc: "Multiplicador aplicado: x1 día (sin escalar)" },
  "30d": { days: 30, label: "30 días (mes)", desc: "Multiplicador aplicado: x30 días (1 mes)" },
  "1y": { days: 365, label: "1 año", desc: "Multiplicador aplicado: x365 días (1 año)" },
};
const CALC_FIELDS = [
  { group: "Gastos energéticos (diarios)", color: "var(--c-cost)", fields: [
    { k: "consumo", label: "Consumo diario", unit: "kWh / día" },
    { k: "precio_kwh", label: "Precio por kWh", unit: "€ / kWh" },
  ] },
  { group: "Ingresos por ventas (diarias) y comisión", color: "var(--c-income)", fields: [
    { k: "num_ventas", label: "Nº de ventas (diarias)", unit: "uds / día" },
    { k: "precio_venta", label: "Precio venta unitario", unit: "€" },
    { k: "comision_pct", label: "Comisión / margen", unit: "%" },
  ], hint: "Fórmula: Nº ventas × Precio venta × (Comisión / 100)" },
];
let calc = loadCalc();
const eur = n => n.toLocaleString("es-ES", { style: "currency", currency: "EUR" });

function loadCalc() {
  try { return { ...CALC_DEFAULTS, ...JSON.parse(localStorage.getItem("dmonte-calc") || "{}") }; } catch { return { ...CALC_DEFAULTS }; }
}

function openCalc() {

            <div class="kpi net"><span class="k-lbl"><span class="dot" style="background:var(--c-net)"></span>Beneficio neto</span><span class="k-val" id="kNeto"></span><span class="k-desc">Ingresos − gastos</span></div>
          </div>

            <span>Ventas brutas acumuladas: <b id="kBruto"></b></span>
          </div>

        </div>

    </div>`;

function renderCalc() {
  if (!$("calcForm")) return;
  const v = k => parseFloat(calc[k]) || 0;
  const per = CALC_PERIODS[calc.period] || CALC_PERIODS["30d"], days = per.days;
  // Costs = daily kWh × €/kWh × days · Income = daily sales × price × commission% × days · Net = income − costs
  const kwh = v("consumo") * days;
  const gastos = kwh * v("precio_kwh");
  const uds = v("num_ventas") * days;
  const bruto = uds * v("precio_venta");
  const ingresos = bruto * (v("comision_pct") / 100);
  const neto = ingresos - gastos;

  document.querySelectorAll("[data-period]").forEach(b => b.setAttribute("aria-pressed", b.dataset.period === calc.period));
  $("calcMult").textContent = per.desc;
  $("kGastos").textContent = eur(gastos);
  $("kGastosD").textContent = `${kwh.toLocaleString("es-ES", { maximumFractionDigits: 1 })} kWh acumulados`;
  $("kIngresos").textContent = eur(ingresos);
  $("kIngresosD").textContent = `${uds.toLocaleString("es-ES", { maximumFractionDigits: 2 })} ventas acumuladas`;
  $("kNeto").textContent = eur(neto);
  $("kNeto").className = "k-val " + (neto >= 0 ? "pos" : "neg");
  $("kKwh").textContent = `${kwh.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} kWh`;
  $("kBruto").textContent = eur(bruto);

  const rows = [["Gastos energéticos", gastos, "var(--c-cost)"], ["Ingreso por comisión", ingresos, "var(--c-income)"], ["Beneficio neto", neto, neto >= 0 ? "var(--c-net)" : "var(--warn)"]];
  const hi = Math.max(0, ...rows.map(r => r[1])), lo = Math.min(0, ...rows.map(r => r[1])), range = hi - lo || 1;
  const zero = -lo / range * 100;
  $("calcBars").innerHTML = rows.map(([label, val, color]) => {
    const w = Math.abs(val) / range * 100, left = val < 0 ? zero - w : zero;
    return `<div class="bar-row"><span>${label}</span><span class="b-val">${eur(val)}</span>
      <div class="bar-track">${lo < 0 ? `<span class="zero" style="left:${zero}%"></span>` : ""}<span class="bar" style="left:${left}%;width:${w}%;background:${color}"></span></div></div>`;
  }).join("");
}

// ---------- Encrypted web version ----------
// The published copy (GitHub Pages) holds no readable data: data.enc.js has the catalogue encrypted with
// AES-GCM (key derived from the password with PBKDF2) and every photo is its own img/<id>.js file.
// Everything is loaded through <script> tags so a downloaded copy of the folder also works from file://.
const KDF_ITER = 600000;
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
const WEB = { aes: null, urls: {}, waiting: {}, pending: {}, queue: [], active: 0 };
const b64 = {
  enc: u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
};
const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, "0")).join("");

async function deriveKeys(password, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  return keysFromRaw(new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: KDF_ITER }, base, 512)));
}
async function keysFromRaw(raw) {
  return {
    raw,
    aes: await crypto.subtle.importKey("raw", raw.slice(0, 32), "AES-GCM", false, ["encrypt", "decrypt"]),
    hmac: await crypto.subtle.importKey("raw", raw.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]),
  };
}
async function seal(aes, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aes, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function unseal(aes, packed) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: packed.subarray(0, 12) }, aes, packed.subarray(12)));
}
async function gzip(bytes, inflate) {
  const s = new Blob([bytes]).stream().pipeThrough(inflate ? new DecompressionStream("gzip") : new CompressionStream("gzip"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function openEnvelope(keys, env) {
  let bytes = await unseal(keys.aes, b64.dec(env.data));
  if (env.z) bytes = await gzip(bytes, true);
  return JSON.parse(new TextDecoder().decode(bytes));
}

// Password screen shown before anything else on the published copy
function unlock() {
  const E = window.DMONTE_ENC;
  return new Promise(async resolve => {
    const done = (keys, data) => { WEB.aes = keys.aes; Object.assign(BASE, data); resolve(); };
    try {   // key remembered on this device
      const saved = JSON.parse(localStorage.getItem("dmonte-key") || "null");
      if (saved && saved.salt === E.salt) { const keys = await keysFromRaw(b64.dec(saved.key)); return done(keys, await openEnvelope(keys, E)); }
    } catch {}
    const box = document.createElement("div");
    box.className = "lock";
    box.innerHTML = `
      <form autocomplete="on">
        <span class="logo" role="img" aria-label="Logotipo de D'Monte"></span>
        <h2>D'Monte <span>Equipamiento</span></h2>
        <p>Catálogo privado. Introduce la contraseña para entrar.</p>
        <input type="text" name="username" value="D'Monte" autocomplete="username" hidden>
        <input type="password" name="pw" placeholder="Contraseña" autocomplete="current-password" required autofocus>
        <label class="toggle"><input type="checkbox" name="remember"> Recordar en este dispositivo</label>
        <button class="btn accent" type="submit">Entrar</button>
        <div class="err" aria-live="polite"></div>
      </form>`;
    document.body.append(box);
    const form = box.querySelector("form"), btn = form.querySelector("button"), err = form.querySelector(".err");
    form.onsubmit = async e => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = "Comprobando…"; err.textContent = "";
      try {
        const keys = await deriveKeys(form.elements.pw.value, b64.dec(E.salt));
        const data = await openEnvelope(keys, E);
        if (form.elements.remember.checked) try { localStorage.setItem("dmonte-key", JSON.stringify({ salt: E.salt, key: b64.enc(keys.raw) })); } catch {}
        box.remove(); done(keys, data);
      } catch {
        err.textContent = "Contraseña incorrecta.";
        btn.disabled = false; btn.textContent = "Entrar"; form.elements.pw.select();
      }
    };
  });
}

// Photos: "enc:<id>" -> img/<id>.js, decrypted on demand into a blob: URL
const isEnc = s => typeof s === "string" && s.startsWith("enc:");
function imgAttr(s) {
  if (!isEnc(s)) return `src="${esc(s)}"`;
  const id = s.slice(4);
  return `src="${WEB.urls[id] || (loadImg(id), BLANK)}" data-enc="${esc(id)}"`;
}
function loadImg(id) {
  if (WEB.urls[id]) return Promise.resolve(WEB.urls[id]);
  if (!WEB.waiting[id]) WEB.waiting[id] = new Promise(res => { WEB.queue.push({ id, res }); pumpImgs(); });
  return WEB.waiting[id];
}
function pumpImgs() {
  while (WEB.active < 6 && WEB.queue.length) {
    const job = WEB.queue.shift(), s = document.createElement("script");
    WEB.active++;
    const finish = url => { WEB.active--; s.remove(); job.res(url); pumpImgs(); };
    WEB.pending[job.id] = finish;
    s.onerror = () => { if (WEB.pending[job.id]) { delete WEB.pending[job.id]; finish(BLANK); } };
    s.src = `img/${job.id}.js`;
    document.head.append(s);
  }
}
window.DMONTE_IMG = async (id, mime, data) => {
  const finish = WEB.pending[id];
  if (!finish) return;
  delete WEB.pending[id];
  let url = BLANK;
  try { url = URL.createObjectURL(new Blob([await unseal(WEB.aes, b64.dec(data))], { type: mime })); } catch {}
  WEB.urls[id] = url;
  document.querySelectorAll(`img[data-enc="${id}"]`).forEach(i => { i.src = url; });
  finish(url);
};
const waitImgs = root => Promise.all([...root.querySelectorAll("img[data-enc]")].map(i => loadImg(i.dataset.enc)));

// ---------- Building the encrypted web copy (local version only) ----------
// Everything is built in memory and downloaded as one ZIP: writing ~850 files one by one through the
// File System Access API is very slow (Chrome checks every file it writes).
// readFile(path) -> bytes of a file inside Catalogo_Web
async function buildWebFiles(password, readFile, progress) {
  const srcHtml = new TextDecoder().decode(await readFile("index.html"));
  const tagIn = '<script src="data.js"><\/script>', tagOut = '<script src="data.enc.js"><\/script>';
  if (!srcHtml.includes(tagIn)) throw new Error("index.html no tiene el formato esperado");
  progress("Generando la clave…");
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const keys = await deriveKeys(password, salt);
  const enc = new TextEncoder(), files = [];

  const refs = new Set();
  PRODUCTS.forEach(p => p.img && refs.add(p.img));
  Object.values(STOCK).forEach(vs => vs.forEach(v => v.img && refs.add(v.img)));
  const map = {}, done = new Set();
  let n = 0, missing = 0;
  for (const ref of refs) {
    if (++n % 10 === 0 || n === refs.size) progress(`Cifrando fotos ${n} de ${refs.size}…`);
    let bytes, mime;
    try {
      if (ref.startsWith("data:")) { mime = ref.slice(5, ref.indexOf(";")); bytes = b64.dec(ref.slice(ref.indexOf(",") + 1)); }
      else { bytes = await readFile(ref); mime = /\.png$/i.test(ref) ? "image/png" : /\.webp$/i.test(ref) ? "image/webp" : "image/jpeg"; }
    } catch { missing++; continue; }
    const id = hex(new Uint8Array(await crypto.subtle.sign("HMAC", keys.hmac, bytes)).slice(0, 16));
    map[ref] = "enc:" + id;
    if (done.has(id)) continue;
    done.add(id);
    files.push({ name: `img/${id}.js`, data: enc.encode(`DMONTE_IMG("${id}","${mime}","${b64.enc(await seal(keys.aes, bytes))}");\n`) });
  }

  progress("Cifrando los datos…");
  const out = { generated: new Date().toISOString().slice(0, 10), products: clone(PRODUCTS), stock: {} };
  out.products.forEach(p => { p.img = map[p.img] || ""; });
  PRODUCTS.forEach(p => { if ((STOCK[p.id] || []).length) out.stock[p.id] = clone(STOCK[p.id]).map(v => ({ ...v, img: map[v.img] || "" })); });
  let bytes = enc.encode(JSON.stringify(out));
  const z = typeof CompressionStream === "function";
  if (z) bytes = await gzip(bytes);
  const env = { v: 1, kdf: "PBKDF2-SHA256", iter: KDF_ITER, salt: b64.enc(salt), z: z ? 1 : 0, data: b64.enc(await seal(keys.aes, bytes)) };
  files.unshift(
    { name: "index.html", data: enc.encode(srcHtml.replace(tagIn, tagOut)) },
    { name: "data.enc.js", data: enc.encode("window.DMONTE_ENC = " + JSON.stringify(env) + ";\n") },
    { name: ".nojekyll", data: new Uint8Array(0) },
  );
  progress("Preparando el ZIP…");
  return { zip: zipStore(files), photos: done.size, missing, machines: out.products.length };
}

// Minimal ZIP writer (no compression: the content is encrypted and would not shrink anyway)
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {
  const now = new Date(), parts = [], central = [], utf8 = new TextEncoder();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let offset = 0, cdSize = 0;
  for (const f of files) {
    const name = utf8.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
    h.setUint32(18, size, true); h.setUint32(22, size, true); h.setUint16(26, name.length, true);
    parts.push(h.buffer, name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true);
    c.setUint32(20, size, true); c.setUint32(24, size, true); c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(c.buffer, name);
    offset += 30 + name.length + size; cdSize += 46 + name.length;
  }
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, e.buffer], { type: "application/zip" });
}

async function readFrom(dir, path) {
  const parts = path.split("/");
  for (const p of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(decodeURIComponent(p));
  return new Uint8Array(await (await (await dir.getFileHandle(decodeURIComponent(parts[parts.length - 1]))).getFile()).arrayBuffer());
}

function openBuildWeb() {
  if (!dataLoaded()) return;
  if (!window.showDirectoryPicker || !window.crypto || !crypto.subtle) { toast("Abre index.html con Chrome o Edge en el ordenador para generar la web.", 6000); return; }
  $("modalBox").innerHTML = `
    <form class="form" id="buildForm" autocomplete="off">
      <div class="form-head"><h3>Generar web cifrada</h3><button type="button" class="icon-btn" data-close aria-label="Cerrar">×</button></div>
      <p style="margin:0;font-size:14px;color:var(--muted)">Crea una copia del catálogo protegida con contraseña para publicarla en GitHub Pages. Los datos y las fotos se cifran en este ordenador y la contraseña no se guarda en ningún archivo.${pendingCount() ? " Se incluirán también los cambios que tienes en este navegador." : ""}</p>
      <div class="fgrid" style="grid-template-columns:1fr 1fr">
        <label class="f"><span>Contraseña (mínimo 8 caracteres)</span><input type="password" name="pw" autocomplete="new-password" required></label>
        <label class="f"><span>Repite la contraseña</span><input type="password" name="pw2" autocomplete="new-password" required></label>
      </div>
      <p style="margin:0;font-size:13px;color:var(--muted)">Se descargará <b>dmonte-web.zip</b>. Descomprímelo en la carpeta de la web (sustituyendo lo que haya) y súbelo a GitHub.</p>
      <div class="specs" id="buildMsg" aria-live="polite"></div>
      <div class="form-foot"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button type="submit" class="btn primary" id="buildGo">Generar y descargar</button></div>
    </form>`;
  $("modal").classList.add("open");
}

async function runBuildWeb(form) {
  const msg = (t, bad) => { const el = $("buildMsg"); if (el) { el.textContent = t; el.className = bad ? "err" : "specs"; } };
  const pw = form.elements.pw.value;
  if (pw.length < 8) return msg("La contraseña debe tener al menos 8 caracteres.", true);
  if (pw !== form.elements.pw2.value) return msg("Las contraseñas no coinciden.", true);
  try {
    // The photos are read from the Catalogo_Web folder (same one used by “Guardar en carpeta”); one permission/picker per click
    let src = await idb.getMeta("dir");
    if (src && (await src.queryPermission({ mode: "readwrite" })) !== "granted") {
      if ((await src.requestPermission({ mode: "readwrite" })) !== "granted") src = null;
      else return msg("Permiso concedido. Pulsa de nuevo “Generar y descargar”.");
    }
    if (!src) {
      msg("Elige la carpeta Catalogo_Web (la que tiene index.html y data.js).");
      src = await window.showDirectoryPicker({ id: "dmonte", mode: "readwrite" });
      try { await src.getFileHandle("data.js"); await src.getFileHandle("index.html"); }
      catch { return msg("Esa carpeta no es Catalogo_Web (no tiene index.html y data.js).", true); }
      await idb.setMeta("dir", src);
      return msg("Carpeta Catalogo_Web guardada. Pulsa de nuevo “Generar y descargar”.");
    }
    $("buildGo").disabled = true;
    const t0 = Date.now();
    const r = await buildWebFiles(pw, p => readFrom(src, p), t => msg(t));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(r.zip); a.download = "dmonte-web.zip"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    msg(`Listo en ${Math.round((Date.now() - t0) / 1000)} s: ${r.machines} máquinas y ${r.photos} fotos${r.missing ? ` (${r.missing} no encontradas)` : ""}. Se ha descargado dmonte-web.zip (${(r.zip.size / 1048576).toFixed(1)} MB).`);
  } catch (e) {
    if (e && e.name === "AbortError") return msg("");
    msg("No se pudo generar la web: " + (e && e.message || e), true);
  } finally { if ($("buildGo")) $("buildGo").disabled = false; }
}

// ---------- Wiring ----------
function render() { renderFilters(); renderGrid(); renderCart(); renderPending(); }

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-toggle],[data-detail],[data-inc],[data-dec],[data-vars],[data-close],[data-edit],[data-vdel],#addVariant,#imgClear,#delMachine,#revertMachine,[data-period],#calcReset,[data-swatch]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.toggle) { toggleCart(ds.toggle); if (ds.reopen) openDetail(ds.toggle); }
  else if (ds.detail) openDetail(ds.detail);
  else if (ds.edit) openEditor(ds.edit);
  else if (ds.inc) setQty(ds.inc, state.cart[ds.inc] + 1);
  else if (ds.dec) setQty(ds.dec, state.cart[ds.dec] - 1);
  else if (ds.vars) { state.open.has(ds.vars) ? state.open.delete(ds.vars) : state.open.add(ds.vars); renderCart(); }
  else if (ds.vdel !== undefined) { readForm(); draft.stock.splice(+ds.vdel, 1); renderEditor(); }
  else if (t.id === "addVariant") { readForm(); draft.stock.push({ code: "", qty: 1, color: "", remark: "", batch: "", img: "" }); renderEditor(); }
  else if (t.id === "imgClear") { readForm(); draft.product.img = ""; renderEditor(); }
  else if (t.id === "delMachine") deleteMachine();
  else if (t.id === "revertMachine") revertMachine();
  else if (ds.swatch) copySwatch(ds.swatch, ds.swatchName);
  else if (ds.period) { calc.period = ds.period; saveCalc(); renderCalc(); }
  else if (t.id === "calcReset") { calc = { ...CALC_DEFAULTS }; saveCalc(); openCalc(); }
  else if ("close" in ds) closeModal();
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.qty) setQty(el.dataset.qty, el.value);
  else if (el.id === "imgFile" && el.files[0]) {
    readForm();
    try { draft.product.img = await resizeImage(el.files[0]); } catch { toast("No se pudo leer esa imagen."); }
    renderEditor();
  } else if (el.dataset.vimg !== undefined && el.files[0]) {
    readForm();
    try { draft.stock[+el.dataset.vimg].img = await resizeImage(el.files[0], 600); } catch { toast("No se pudo leer esa imagen."); }
    renderEditor();
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset && e.target.dataset.calc) { calc[e.target.dataset.calc] = e.target.value; saveCalc(); renderCalc(); return; }
  if (e.target.dataset && e.target.dataset.k === "qty" && $("vTotal")) {
    $("vTotal").textContent = [...document.querySelectorAll('[data-k="qty"]')].reduce((s, i) => s + (parseInt(i.value, 10) || 0), 0);
  }
});
document.addEventListener("submit", e => { if (e.target.id === "editForm") { e.preventDefault(); saveDraft(); } else if (e.target.id === "calcForm") e.preventDefault(); else if (e.target.id === "buildForm") { e.preventDefault(); runBuildWeb(e.target); } });
$("modal").addEventListener("mousedown", e => { if (e.target.id === "modal" && !$("editForm") && !$("buildForm")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("editForm") || confirm("¿Cerrar sin guardar?")) closeModal(); openDrawer(false); } });
$("search").addEventListener("input", e => { state.q = e.target.value.trim(); state.shown = PAGE; renderFilters(); renderGrid(); });
$("onlyStock").addEventListener("change", e => { state.onlyStock = e.target.checked; state.shown = PAGE; render(); });
$("openCart").onclick = () => openDrawer(true);
$("closeCart").onclick = () => openDrawer(false);
$("scrim").onclick = () => openDrawer(false);
$("clearCart").onclick = () => { if (confirm("¿Vaciar toda la selección?")) { state.cart = {}; saveCart(); render(); } };
$("exportCsv").onclick = exportCsv;
$("printBtn").onclick = printSelection;
$("manageBtn").onclick = () => {
  state.manage = !state.manage;
  document.body.classList.toggle("manage", state.manage);
  $("manageBtn").setAttribute("aria-pressed", state.manage);
};
$("calcBtn").onclick = openCalc;
$("cushionBtn").onclick = openCushions;
$("themeBtn").onclick = () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("dmonte-theme", t); } catch {}
  renderThemeBtn();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderThemeBtn);
$("buildWeb").onclick = openBuildWeb;
$("forgetKey").onclick = () => { try { localStorage.removeItem("dmonte-key"); } catch {} toast("Este dispositivo ya no recuerda la contraseña."); };
$("addBtn").onclick = () => openEditor(null);
$("saveFolder").onclick = saveToFolder;
$("downloadData").onclick = () => { if (!dataLoaded()) return; download("data.js", dataJs(), "text/javascript"); toast("Sustituye data.js en la carpeta Catalogo_Web por el archivo descargado y recarga la página.", 7000); };
$("exportBackup").onclick = () => download(`dmonte_backup_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(OVERRIDES), "application/json");
$("importBackup").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    for (const [id, v] of Object.entries(data)) { OVERRIDES[id] = v; await idb.put(id, v); }
    rebuild(); render(); toast(`Importados ${Object.keys(data).length} cambios.`);
  } catch { toast("Ese archivo no es una copia válida."); }
  e.target.value = "";
};
$("discardAll").onclick = async () => {
  if (!pendingCount() || !confirm("¿Descartar todos los cambios que aún no están guardados en data.js?")) return;
  OVERRIDES = {}; await idb.clear(); rebuild(); render(); toast("Cambios locales descartados.");
};

(async () => {
  renderThemeBtn();
  if (window.DMONTE_ENC) await unlock();
  if (window.SINGLE_FILE || window.DMONTE_ENC) { $("saveFolder").hidden = true; $("downloadData").hidden = true; $("buildWeb").hidden = true; }
  if (window.DMONTE_ENC) $("forgetKey").hidden = false;
  await idb.open();
  OVERRIDES = await idb.all();
  rebuild(); render();
  if (!BASE.products.length) {
    $("grid").innerHTML = '<div class="empty">No se pudo cargar data.js. Mantén juntos index.html, data.js y la carpeta img, y abre index.html desde esa carpeta en tu ordenador (no desde drive.google.com).</div>';
    $("saveFolder").disabled = $("downloadData").disabled = true;
  }
})();
</script>
