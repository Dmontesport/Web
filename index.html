  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  if (push) history.replaceState(null, "", nutri ? "#nutricion" : location.pathname + location.search);
  if (nutri) { mountNutri(); vmStart(); } else vmStop();
}

// ---------- Machine videos ----------
// p.video is "enc:<id>" (encrypted vid/<id>.js in the published copy) or a plain path / URL (local copy).
// An encrypted video starts downloading as soon as the machine's card opens, with a progress bar, and is
// decrypted in memory only (nothing is saved on the device); the last few stay ready for the session.
const VID = { urls: new Map(), loading: null };

function videoBox(p) {
  if (!p.video) return "";
  return `<div class="vbox" id="vbox" data-video="${esc(p.video)}"><div class="vwait"><div class="vbar"><span id="vbar"></span></div><span id="vmsg">Cargando vídeo…</span></div></div>`;
}
function showVideo(url) {
  const box = $("vbox");
  if (!box) return;
  box.innerHTML = `<video src="${esc(url)}" controls playsinline preload="auto" controlslist="nodownload" disablepictureinpicture oncontextmenu="return false"></video>`;
  box.querySelector("video").addEventListener("loadedmetadata", e => {   // fit the box to the video's shape (many are vertical)
    const { videoWidth: w, videoHeight: h } = e.target;
    if (w && h) { box.style.aspectRatio = `${w} / ${h}`; box.style.width = `min(100%, calc(60vh * ${(w / h).toFixed(4)}))`; }
  });
}
// Encrypted file: DMONTE_VID("<id>","<mime>","<base64 of iv + ciphertext>");
async function fetchVideo(id, size, signal, progress) {
  if (location.protocol === "file:") {   // downloaded copy: the browser cannot fetch from disk, load it as a script
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      window.DMONTE_VID = (vid, mime, data) => { if (vid === id) res({ mime, data }); };
      s.onerror = () => rej(new Error("no encontrado")); s.onload = () => s.remove();
      s.src = `vid/${id}.js`; document.head.append(s);
    });
  }
  const r = await fetch(`vid/${id}.js`, { signal });
  if (!r.ok) throw new Error("no encontrado");
  const total = size || +r.headers.get("Content-Length") || 0, reader = r.body.getReader(), parts = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value); got += value.length;
    if (total) progress(Math.min(0.99, got / total));
  }
  const q = (await new Blob(parts).text()).split('"');
  return { mime: q[3], data: q[5] };
}
async function startVideo(force) {
  const box = $("vbox");
  if (!box) return;
  const ref = box.dataset.video;
  if (!isEnc(ref)) return showVideo(ref);
  const id = ref.slice(4);
  if (VID.urls.has(id)) return showVideo(VID.urls.get(id));
  if ((VIDEOS[id] || {}).pending) {   // added on this device and not published yet: play the local file
    const blob = await idb.getMeta(vidKey(id));
    if (blob) { const url = URL.createObjectURL(blob); VID.urls.set(id, url); return showVideo(url); }
  }
  if (!force && navigator.connection && navigator.connection.saveData) {
    $("vmsg").innerHTML = 'Ahorro de datos activado. <button type="button" class="btn small" data-vgo>▶ Cargar vídeo</button>';
    return;
  }
  if (VID.loading) VID.loading.abort();
  const ctl = VID.loading = new AbortController();
  const show = f => { const b = $("vbar"), m = $("vmsg"); if (b) b.style.width = Math.round(f * 100) + "%"; if (m) m.textContent = `Cargando vídeo… ${Math.round(f * 100)} %`; };
  try {
    const v = await fetchVideo(id, (VIDEOS[id] || {}).size, ctl.signal, show);
    show(1);
    const url = URL.createObjectURL(new Blob([await unseal(WEB.aes, b64.dec(v.data))], { type: v.mime }));
    VID.urls.set(id, url);
    if (VID.urls.size > 3) { const [k, u] = VID.urls.entries().next().value; URL.revokeObjectURL(u); VID.urls.delete(k); }
    if ($("vbox") && $("vbox").dataset.video === ref) showVideo(url);
  } catch (e) {
    if (e.name !== "AbortError" && $("vmsg")) $("vmsg").textContent = "No se pudo cargar el vídeo.";
  } finally { if (VID.loading === ctl) VID.loading = null; }
}

// Photo / video carousel in the machine's card (swipe, arrows or the Foto / Vídeo buttons)
function mediaHtml(p) {
  if (!p.video) return picHtml(p);
  return `<div class="media">
      <div class="mtrack" id="mtrack"><div class="mslide">${picHtml(p)}</div><div class="mslide">${videoBox(p)}</div></div>
      <button type="button" class="mnav prev" data-mnav="-1" aria-label="Anterior" disabled><svg viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg></button>
      <button type="button" class="mnav next" data-mnav="1" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg></button>
      <div class="mdots"><button type="button" data-mgo="0" aria-current="true">Foto</button><button type="button" data-mgo="1" aria-current="false">▶ Vídeo</button></div>
    </div>`;
}
function mediaSync(i) {
  const t = $("mtrack");
  if (!t) return;
  document.querySelectorAll("[data-mgo]").forEach(b => b.setAttribute("aria-current", +b.dataset.mgo === i));
  document.querySelector(".mnav.prev").disabled = i <= 0;
  document.querySelector(".mnav.next").disabled = i >= t.children.length - 1;
  const v = t.querySelector("video");
  if (v && i !== 1 && !v.paused) v.pause();   // leaving the video slide pauses it
}
function mediaGo(i) {
  const t = $("mtrack");
  if (!t) return;
  i = clamp(i, 0, t.children.length - 1);
  t.scrollTo({ left: i * t.clientWidth });
  mediaSync(i);
}
const mediaIndex = () => { const t = $("mtrack"); return t ? Math.round(t.scrollLeft / t.clientWidth) : 0; };
function bindMedia() {
  const t = $("mtrack");
  if (t) t.addEventListener("scroll", () => mediaSync(mediaIndex()), { passive: true });   // swiping
}
// ---------- Video library ----------
// BASE.videos = { <id>: { name, size } }, each published as vid/<id>.js; a machine points to one with p.video = "enc:<id>",
// so one video can serve several machines. Videos added on this device wait in IndexedDB ("vid:<id>") as pending
// entries of the "__videos__" override until "Publicar cambios" encrypts and uploads them.
const vidKey = id => "vid:" + id;
const VIDEO_FAMILIES = { "LDEP-01": ["LDEP-02", "LDEP-03", "LDEP-04"], "LDM-05A": ["LDM-05B", "LDM-09", "LDM-10"], "LDLN-024": ["LDLN-029"] };
const mbText = b => (b / 1048576).toLocaleString("es-ES", { maximumFractionDigits: 1 }) + " MB";

async function addVideoFiles(files) {
  const pend = { ...((OVERRIDES.__videos__ || {}).videos || {}) }, out = [];
  for (const file of files) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const id = hex(new Uint8Array(await crypto.subtle.sign("HMAC", WEB.keys.hmac, bytes)).slice(0, 16));
    if (!VIDEOS[id] && !pend[id]) {
      await idb.setMeta(vidKey(id), new Blob([bytes], { type: file.type || "video/mp4" }));
      pend[id] = { name: file.name, bytes: bytes.length, pending: true };
    }
    out.push({ id, name: file.name, bytes: bytes.length });
  }
  OVERRIDES.__videos__ = { videos: pend, updated: new Date().toISOString() };
  await idb.put("__videos__", OVERRIDES.__videos__);
  rebuild();
  return out;
}
function videoOptions(cur) {
  const list = Object.entries(VIDEOS).sort((a, b) => a[1].name.localeCompare(b[1].name, "es", { numeric: true }));
  return '<option value="">Sin vídeo</option>' + list.map(([id, v]) => `<option value="enc:${id}" ${cur === "enc:" + id ? "selected" : ""}>${esc(v.name)}${v.pending ? " (sin publicar)" : ""}</option>`).join("");
}
// File name -> machines: the same model, its variants (LDT-997 -> LDT-997-1.6, LD-9087 -> LD-9087T) and its family
function videoTargets(name) {
  const base = normId(name.replace(/\.[^.]+$/, ""));
  const ids = PRODUCTS.filter(p => p.id === base || (p.id.startsWith(base) && !/^[0-9]/.test(p.id.slice(base.length)))).map(p => p.id);
  for (const id of VIDEO_FAMILIES[base] || []) if (byId[id] && !ids.includes(id)) ids.push(id);
  return ids;
}

let videoImport = null;
function openVideoImport() {
  videoImport = null;
  $("modalBox").innerHTML = `
    <form class="form" id="videoImportForm" onsubmit="return false">
      <div class="form-head"><h3>Añadir vídeos</h3><button type="button" class="icon-btn" data-close aria-label="Cerrar">×</button></div>
      <p style="margin:0;font-size:14px;color:var(--muted)">Elige los vídeos (MP4). Cada uno se asigna a la máquina cuyo modelo coincide con el nombre del archivo, a sus variantes y a su familia. Revisa la lista, pulsa “Asignar vídeos” y después “Publicar cambios”.</p>
      <label class="btn" style="cursor:pointer;justify-self:start">Elegir vídeos…<input type="file" id="videoImportFile" accept="video/mp4,video/*" multiple hidden></label>
      <div id="videoImportList"></div>
      <div class="form-foot"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button type="button" class="btn primary" id="videoImportApply" disabled>Asignar vídeos</button></div>
    </form>`;
  $("modal").classList.add("open");
}
async function prepareVideoImport(files) {
  $("videoImportList").innerHTML = '<div class="specs">Preparando vídeos…</div>';
  const added = await addVideoFiles(files);
  const baseOf = v => normId(v.name.replace(/\.[^.]+$/, ""));
  const pick = {};   // each machine takes the closest file name: its exact model first, then the longest prefix
  added.forEach(v => videoTargets(v.name).forEach(pid => {
    const score = pid === baseOf(v) ? 1000 : baseOf(v).length;
    if (!pick[pid] || score > pick[pid].score) pick[pid] = { name: v.name, score };
  }));
  videoImport = added.map(v => ({ ...v, machines: Object.keys(pick).filter(pid => pick[pid].name === v.name) }));
  const seen = {};
  $("videoImportList").innerHTML = `<div class="vimport">${videoImport.map((v, i) => {
    const dup = seen[v.id]; seen[v.id] = seen[v.id] || v.name;
    return `<div class="vrow"><div><b>${esc(v.name)}</b><span>${mbText(v.bytes)}${dup ? ` · mismo vídeo que ${esc(dup)}` : ""}</span></div>
      <div class="vmach">${v.machines.length ? v.machines.map(pid => `<label><input type="checkbox" data-vimp="${i}" value="${esc(pid)}" checked>${esc(byId[pid].model)} <small>${esc(byId[pid].name)}${byId[pid].video && byId[pid].video !== "enc:" + v.id ? " · sustituye su vídeo" : ""}</small></label>`).join("")
        : '<span class="specs">Ninguna máquina coincide: queda en la videoteca para asignarlo desde el editor.</span>'}</div></div>`;
  }).join("")}</div>`;
  $("videoImportApply").disabled = false;
}
async function applyVideoImport() {
  if (!videoImport) return;
  let n = 0;
  for (const box of document.querySelectorAll("[data-vimp]:checked")) {
    const v = videoImport[+box.dataset.vimp], pid = box.value, p = byId[pid];
    if (!p) continue;
    const rec = { product: { ...clone(p), video: "enc:" + v.id }, stock: clone(STOCK[pid] || []), updated: new Date().toISOString() };
    OVERRIDES[pid] = rec; await idb.put(pid, rec); n++;
  }
  rebuild(); closeModal(); render();
  const vids = new Set(videoImport.map(v => v.id)).size;
  toast(`${vids} vídeo${vids === 1 ? "" : "s"} preparado${vids === 1 ? "" : "s"} para ${n} máquina${n === 1 ? "" : "s"}. Pulsa “Publicar cambios” para subirlos.`, 8000);
}

// ---------- Installable app (PWA) ----------
// manifest.webmanifest, the icons and sw.js sit next to index.html in the published copy (“Publicar app” uploads them).
// The service worker keeps the app usable offline; once installed, every photo is stored on the device too
// (videos only after they have been watched).
const PWA_CACHE = "dmonte-v1";
const PWA_FILES = ["manifest.webmanifest", "sw.js", "icons/icon-192.png", "icons/icon-512.png", "icons/icon-maskable-512.png"];

function pwaStart() {
  if (!window.DMONTE_ENC || !("serviceWorker" in navigator) || !window.isSecureContext || location.protocol === "file:") return;
  navigator.serviceWorker.register("sw.js").catch(() => {});
  if (matchMedia("(display-mode: standalone)").matches) setTimeout(warmOfflineCache, 4000);
}
async function warmOfflineCache() {
  if (!("caches" in window) || (navigator.connection && navigator.connection.saveData)) return;
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
  const ids = new Set(), add = r => { if (isEnc(r)) ids.add(r.slice(4)); };
  PRODUCTS.forEach(p => add(p.img));
  Object.values(STOCK).forEach(vs => vs.forEach(v => add(v.img)));
  (SCREEN || []).forEach(s => add(s.img));
  const cache = await caches.open(PWA_CACHE), todo = [];
  for (const id of ids) if (!(await cache.match(`img/${id}.js`))) todo.push(`img/${id}.js`);
  for (let i = 0; i < todo.length; i += 4) await Promise.all(todo.slice(i, i + 4).map(u => cache.add(u).catch(() => {})));
}

// ---------- Wiring ----------
function render() { renderFilters(); renderGrid(); renderCart(); renderPending(); }

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-toggle],[data-detail],[data-inc],[data-dec],[data-vars],[data-close],[data-edit],[data-vdel],#addVariant,#imgClear,#delMachine,#revertMachine,[data-period],#calcReset,[data-swatch],#ghForget,[data-view3d],[data-back3d],[data-clear],#v3reset,#arBtn,[data-tab],[data-slide-up],[data-slide-down],[data-slide-del],#slidesDefault,#slidesSave,[data-vgo],[data-mnav],[data-mgo],#videoImportApply");
  if (!t) return;
  const ds = t.dataset;
  if (ds.toggle) { toggleCart(ds.toggle); if (ds.reopen) openDetail(ds.toggle); }
  else if (ds.detail) openDetail(ds.detail);
  else if (ds.edit) openEditor(ds.edit);
  else if (ds.inc) setQty(ds.inc, state.cart[ds.inc] + 1);
  else if (ds.dec) setQty(ds.dec, state.cart[ds.dec] - 1);
  else if (ds.vars) { state.open.has(ds.vars) ? state.open.delete(ds.vars) : state.open.add(ds.vars); renderCart(); }
  else if (ds.vdel !== undefined) { readForm(); draft.stock.splice(+ds.vdel, 1); renderEditor(); }
  else if (t.id === "addVariant") { readForm(); draft.stock.push({ code: "", qty: 1, color: "", remark: "", batch: "", img: "" }); renderEditor(); }
  else if (t.id === "imgClear") { readForm(); draft.product.img = ""; renderEditor(); }
  else if (t.id === "delMachine") deleteMachine();
  else if (t.id === "revertMachine") revertMachine();
  else if (ds.swatch) copySwatch(ds.swatch, ds.swatchName);
  else if (ds.view3d) open3D(ds.view3d);
  else if (ds.back3d) { stop3D(); $("modalBox").classList.remove("wide"); openDetail(ds.back3d); }
  else if (ds.clear !== undefined) setClearance(+ds.clear);
  else if (t.id === "v3reset") reset3D();
  else if (t.id === "arBtn") startAR();
  else if (ds.tab) setTab(ds.tab, true);
  else if (ds.slideUp !== undefined) moveSlide(+ds.slideUp, -1);
  else if (ds.slideDown !== undefined) moveSlide(+ds.slideDown, 1);
  else if (ds.slideDel !== undefined) { screenDraft.splice(+ds.slideDel, 1); renderScreenEditor(); }
  else if (t.id === "slidesDefault") { screenDraft = clone(SCREEN_DEFAULT); renderScreenEditor(); }
  else if (t.id === "slidesSave") saveScreen(false);
  else if ("vgo" in ds) startVideo(true);
  else if (ds.mnav) mediaGo(mediaIndex() + +ds.mnav);
  else if (ds.mgo !== undefined) mediaGo(+ds.mgo);
  else if (t.id === "videoImportApply") applyVideoImport();
  else if (t.id === "ghForget") { if (confirm("¿Quitar la conexión con GitHub en este dispositivo?")) { try { localStorage.removeItem("dmonte-gh"); } catch {} closeModal(); applyEditorMode(); toast("Conexión con GitHub quitada."); } }
  else if (ds.period) { calc.period = ds.period; saveCalc(); renderCalc(); }
  else if (t.id === "calcReset") { calc = { ...CALC_DEFAULTS }; saveCalc(); mountCalc(); }
  else if ("close" in ds) closeModal();
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.qty) setQty(el.dataset.qty, el.value);
  else if (el.id === "slideFile" && el.files.length) {
    for (const file of el.files) { try { screenDraft.push({ img: await resizeImage(file, 1080, "#000") }); } catch { toast("No se pudo leer esa imagen."); } }
    renderScreenEditor();
  } else if (el.id === "videoFile" && el.files[0]) {
    readForm();
    try { const [v] = await addVideoFiles([el.files[0]]); draft.product.video = "enc:" + v.id; } catch { toast("No se pudo leer ese vídeo."); }
    renderEditor();
  } else if (el.id === "videoImportFile" && el.files.length) {
    await prepareVideoImport([...el.files]);
  } else if (el.id === "imgFile" && el.files[0]) {
    readForm();
    try { draft.product.img = await resizeImage(el.files[0]); } catch { toast("No se pudo leer esa imagen."); }
    renderEditor();
  } else if (el.dataset.vimg !== undefined && el.files[0]) {
    readForm();
    try { draft.stock[+el.dataset.vimg].img = await resizeImage(el.files[0], 600); } catch { toast("No se pudo leer esa imagen."); }
    renderEditor();
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset && e.target.dataset.calc) { calc[e.target.dataset.calc] = e.target.value; saveCalc(); renderCalc(); return; }
  if (e.target.dataset && e.target.dataset.k === "qty" && $("vTotal")) {
    $("vTotal").textContent = [...document.querySelectorAll('[data-k="qty"]')].reduce((s, i) => s + (parseInt(i.value, 10) || 0), 0);
  }
});
document.addEventListener("submit", e => { if (e.target.id === "editForm") { e.preventDefault(); saveDraft(); } else if (e.target.id === "calcForm") e.preventDefault(); else if (e.target.id === "buildForm") { e.preventDefault(); runBuildWeb(e.target); } else if (e.target.id === "ghForm") { e.preventDefault(); saveGhSetup(e.target); } else if (e.target.id === "screenForm") { e.preventDefault(); saveScreen(!!window.DMONTE_ENC); } });
$("modal").addEventListener("mousedown", e => { if (e.target.id === "modal" && !$("editForm") && !$("buildForm") && !$("screenForm")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("editForm") || confirm("¿Cerrar sin guardar?")) closeModal(); openDrawer(false); } });
$("search").addEventListener("input", e => { state.q = e.target.value.trim(); state.shown = PAGE; renderFilters(); renderGrid(); });
$("onlyStock").addEventListener("change", e => { state.onlyStock = e.target.checked; state.shown = PAGE; render(); });
$("openCart").onclick = () => openDrawer(true);
$("closeCart").onclick = () => openDrawer(false);
$("scrim").onclick = () => openDrawer(false);
$("clearCart").onclick = () => { if (confirm("¿Vaciar toda la selección?")) { state.cart = {}; saveCart(); render(); } };
$("exportCsv").onclick = exportCsv;
$("printBtn").onclick = printSelection;
$("manageBtn").onclick = () => {
  state.manage = !state.manage;
  document.body.classList.toggle("manage", state.manage);
  $("manageBtn").setAttribute("aria-pressed", state.manage);
};
$("vmSpin").onclick = () => { VM.spin = !VM.spin; $("vmSpin").setAttribute("aria-pressed", VM.spin); };
$("vmReset").onclick = () => { VM.az = -0.55; VM.el = 0.2; VM.zoom = 1; };
$("vmEdit").onclick = openScreenEditor;
$("videoImportBtn").onclick = openVideoImport;
addEventListener("hashchange", () => setTab(location.hash === "#nutricion" ? "nutricion" : "catalogo"));
$("cushionBtn").onclick = openCushions;
$("themeBtn").onclick = () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("dmonte-theme", t); } catch {}
  renderThemeBtn();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderThemeBtn);
$("buildWeb").onclick = openBuildWeb;
$("publishBtn").onclick = publishChanges;
$("publishAppBtn").onclick = publishApp;
$("ghSetupBtn").onclick = openGhSetup;
addEventListener("hashchange", () => { if (location.hash === "#editor" && !window.SINGLE_FILE) openGhSetup(); });
$("forgetKey").onclick = () => { try { localStorage.removeItem("dmonte-key"); } catch {} toast("Este dispositivo ya no recuerda la contraseña."); };
$("addBtn").onclick = () => openEditor(null);
$("saveFolder").onclick = saveToFolder;
$("downloadData").onclick = () => { if (!dataLoaded()) return; download("data.js", dataJs(), "text/javascript"); toast("Sustituye data.js en la carpeta Catalogo_Web por el archivo descargado y recarga la página.", 7000); };
$("exportBackup").onclick = () => download(`dmonte_backup_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(OVERRIDES), "application/json");
$("importBackup").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    for (const [id, v] of Object.entries(data)) { OVERRIDES[id] = v; await idb.put(id, v); }
    rebuild(); render(); toast(`Importados ${Object.keys(data).length} cambios.`);
  } catch { toast("Ese archivo no es una copia válida."); }
  e.target.value = "";
};
$("discardAll").onclick = async () => {
  if (!pendingCount() || !confirm("¿Descartar todos los cambios que aún no están guardados en data.js?")) return;
  for (const [id, v] of Object.entries(VIDEOS)) if (v.pending) await idb.delMeta(vidKey(id));
  OVERRIDES = {}; await idb.clear(); rebuild(); render(); toast("Cambios locales descartados.");
};

(async () => {
  renderThemeBtn();
  if (window.DMONTE_ENC) await unlock();
  if (window.SINGLE_FILE || window.DMONTE_ENC) { $("saveFolder").hidden = true; $("downloadData").hidden = true; $("buildWeb").hidden = true; }
  if (window.DMONTE_ENC) $("forgetKey").hidden = false;
  applyEditorMode();
  await idb.open();
  OVERRIDES = await idb.all();
  rebuild(); render();
  pwaStart();
  if (!BASE.products.length) {
    $("grid").innerHTML = '<div class="empty">No se pudo cargar data.js. Mantén juntos index.html, data.js y la carpeta img, y abre index.html desde esa carpeta en tu ordenador (no desde drive.google.com).</div>';
    $("saveFolder").disabled = $("downloadData").disabled = true;
  }
  if (location.hash === "#nutricion") setTab("nutricion");
  if (location.hash === "#editor" && !window.SINGLE_FILE) openGhSetup();
})();
