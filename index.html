<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --surface-2: #f0f0ed;
    --ink: #18181b;
    --muted: #71717a;
    --line: #e6e6e2;
    --accent: #1438b0;
    --accent-soft: #e7ecfa;
    --accent-ink: #1438b0;
    --ok: #15803d;
    --ok-bg: #e8f5ec;
    --warn: #b91c1c;
    --warn-bg: #fdeceb;
    --none: #8a8a8f;
    --none-bg: #f0f0ed;
    --info-bg: #eef2fc;
    --img-bg: #ffffff;
    --scrim: rgba(17, 17, 20, .38);
    --shadow: 0 1px 2px rgba(17, 17, 20, .04), 0 2px 10px rgba(17, 17, 20, .04);
    --shadow-lg: 0 24px 60px rgba(17, 17, 20, .18);
    --c-cost: #e0901a;
    --c-income: #16a34a;
    --c-net: #1438b0;
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f11; --surface: #18181b; --surface-2: #232328; --ink: #f4f4f5; --muted: #a1a1aa; --line: #2b2b31;
      --accent: #3d63e6; --accent-soft: #18224a; --accent-ink: #8ea8ff; --ok: #4ade80; --ok-bg: #11301d; --warn: #f87171; --warn-bg: #3a1616;
      --none: #a1a1aa; --none-bg: #26262b; --info-bg: #141b38; --img-bg: #f7f7f5; --scrim: rgba(0, 0, 0, .6);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .55);
      --c-cost: #f0a63a; --c-income: #4ade80; --c-net: #8ea8ff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f11; --surface: #18181b; --surface-2: #232328; --ink: #f4f4f5; --muted: #a1a1aa; --line: #2b2b31;
    --accent: #3d63e6; --accent-soft: #18224a; --accent-ink: #8ea8ff; --ok: #4ade80; --ok-bg: #11301d; --warn: #f87171; --warn-bg: #3a1616;
    --none: #a1a1aa; --none-bg: #26262b; --info-bg: #141b38; --img-bg: #f7f7f5; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .55);
    --c-cost: #f0a63a; --c-income: #4ade80; --c-net: #8ea8ff; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

wvFcXWrzaumd9O3hAAAA///E4QjpAAAABklEQVQDAEFm87rNtQtIAAAAAElFTkSuQmCC); width: 40px; height: 28px; flex: none; background: var(--ink); -webkit-mask: var(--mark) center / contain no-repeat; mask: var(--mark) center / contain no-repeat; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
  header h1 span { color: var(--muted); font-weight: 450; }
  .search-wrap { flex: 1; max-width: 440px; margin-left: auto; position: relative; display: flex; align-items: center; }
  .search-wrap svg { position: absolute; left: 12px; color: var(--muted); pointer-events: none; width: 16px; height: 16px; }
  .search { width: 100%; padding: 9px 14px 9px 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); transition: border-color .15s, background .15s; }
  .search:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .actions { display: flex; align-items: center; gap: 6px; }
  .hbtn { display: inline-flex; align-items: center; gap: 7px; background: transparent; color: var(--ink); border: 1px solid transparent; border-radius: 10px; padding: 8px 11px; white-space: nowrap; font-size: 14px; font-weight: 500; transition: background .15s, border-color .15s; }
  .hbtn:hover { background: var(--surface-2); }
  .hbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .hbtn.icon { padding: 8px; }
  .cart-btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; margin-left: 4px; transition: filter .15s; }
  .cart-btn:hover { filter: brightness(1.06); }
  .cart-btn .count { background: rgba(255, 255, 255, .24); border-radius: 999px; min-width: 22px; padding: 0 7px; text-align: center; font-size: 12.5px; line-height: 20px; }

  .manage-bar { display: none; background: var(--info-bg); border-bottom: 1px solid var(--line); padding: 10px 28px; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  body.manage .manage-bar { display: flex; }
  .manage-bar .pending { margin-right: auto; color: var(--accent-ink); }
  .manage-bar .pending b { color: var(--warn); }

  .filters { padding: 22px 28px 4px; display: grid; gap: 12px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .filter-row .label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); width: 120px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 12px; border-radius: 999px; font-size: 13.5px; white-space: nowrap; transition: border-color .15s, background .15s; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .chip .n { color: var(--muted); font-size: 11.5px; margin-left: 5px; }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .6; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  .result-count { padding: 10px 28px 0; color: var(--muted); font-size: 13px; }

  .grid { padding: 12px 28px 48px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; position: relative; transition: box-shadow .2s, transform .2s, border-color .2s; }
  .card:hover { box-shadow: var(--shadow), 0 10px 28px rgba(17, 17, 20, .07); transform: translateY(-2px); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .pic { background: var(--img-bg); aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; cursor: zoom-in; border: 0; padding: 14px; margin: 6px 6px 0; border-radius: 10px; }
  .card .pic img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .noimg { color: var(--muted); font-size: 13px; }
  .card .body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .model { font-weight: 650; font-size: 15.5px; letter-spacing: -.01em; }
  .name { color: var(--muted); font-size: 13.5px; margin-top: -4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 11px; background: var(--surface-2); border-radius: 6px; padding: 2px 7px; color: var(--muted); }
  .tag.flag { background: var(--accent-soft); color: var(--accent-ink); }
  .specs { font-size: 12px; color: var(--muted); }
  .card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 8px; gap: 8px; }
  .stock { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .stock.in { color: var(--ok); background: var(--ok-bg); }
  .stock.out { color: var(--none); background: var(--none-bg); }
  .add { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 500; transition: border-color .15s, background .15s; }
  .add:hover { border-color: var(--ink); }
  .add.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .edit-btn { display: none; position: absolute; top: 12px; right: 12px; background: var(--ink); color: var(--surface); border: 0; border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 500; z-index: 1; }
  body.manage .edit-btn { display: block; }
  .edited { position: absolute; top: 12px; left: 12px; font-size: 11px; font-weight: 600; background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 8px; z-index: 1; }
  .empty { padding: 48px 24px; color: var(--muted); text-align: center; grid-column: 1 / -1; }
  #sentinel { height: 1px; }

    .swatches { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; }

    .bars { padding: 12px; gap: 12px; }
  }
  @media (max-width: 400px) {
    header h1 span { display: none; }
  }

  @media print {
    body { background: #fff; color: #000; }
    header, .manage-bar, .filters, .result-count, .grid, .scrim, .modal, .drawer, .toast, .nutri { display: none !important; }
    .print-only { display: block; }
    .print-only h1 { font-size: 20px; margin: 0 0 4px; }
    .print-only .meta { color: #555; font-size: 12px; margin-bottom: 12px; }
    .print-only table { width: 100%; border-collapse: collapse; font-size: 12px; }

  }
</style>
</head>

<script src="data.enc.js"></script>
<script>
// ===========================================================================
// Data: data.js (generated from CATALOGO.pdf + the inventory Excel) holds
//   { products: [...], stock: { ID: [variants] } }
// Changes made in "Manage" mode are kept in this browser (IndexedDB) until
// "Save to folder" / "Download data.js" writes a new data.js.
// ===========================================================================
const BASE = window.CATALOG_DATA || { products: [], stock: {} };
const GROUP_ORDER = ["Upper body", "Lower body", "Core", "Full body", "Cardio", "Functional training", "Accessories", "Unclassified"];
const STD_FUNCS = ["Chest", "Back", "Shoulders", "Biceps", "Triceps", "Arms", "Quads", "Hamstrings", "Glutes & hip",
  "Adductors / abductors", "Calves", "Abs", "Obliques", "Lower back", "Cable / pulley", "Multi-station",
  "Squat / smith / rack", "Bench", "Treadmill", "Bike", "Elliptical", "Rower", "Stair climber",
  "Sprint / resistance", "Free weights", "Storage", "Smart / digital", "Other"];
const PAGE = 60;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const normId = s => String(s || "").toUpperCase().replace(/\s+/g, "");
const clone = o => JSON.parse(JSON.stringify(o));
// Spanish labels for the English group / function / section values stored in data.js
const ES = {
  "Upper body": "Tren superior", "Lower body": "Tren inferior", "Core": "Core", "Full body": "Cuerpo completo", "Cardio": "Cardio",
  "Functional training": "Entrenamiento funcional", "Accessories": "Accesorios", "Unclassified": "Sin clasificar",
  "Customize": "Personalizado", "Multi-functional": "Multifuncional", "Nutrition": "Nutrición", "Smart": "Inteligente", "Strength": "Fuerza", "Track and Field": "Atletismo",
  "Chest": "Pecho", "Back": "Espalda", "Shoulders": "Hombros", "Biceps": "Bíceps", "Triceps": "Tríceps", "Arms": "Brazos", "Quads": "Cuádriceps",
  "Hamstrings": "Isquiotibiales", "Glutes & hip": "Glúteos y cadera", "Adductors / abductors": "Aductores / abductores", "Calves": "Gemelos",
  "Abs": "Abdominales", "Obliques": "Oblicuos", "Lower back": "Zona lumbar", "Cable / pulley": "Cable / polea", "Multi-station": "Multiestación",
  "Squat / smith / rack": "Sentadilla / multipower / rack", "Bench": "Banco", "Treadmill": "Cinta de correr", "Bike": "Bicicleta", "Elliptical": "Elíptica",
  "Rower": "Remo", "Stair climber": "Escaladora", "Sprint / resistance": "Sprint / resistencia", "Free weights": "Peso libre", "Storage": "Almacenaje",
  "Smart / digital": "Inteligente / digital", "Other": "Otros",
};
const ES_REV = Object.fromEntries(Object.entries(ES).map(([k, v]) => [v.toLowerCase(), k]));
const tr = s => ES[s] || s;
const unTr = s => ES_REV[String(s).toLowerCase()] || s;
const fold = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

// ---------- IndexedDB (local edits) ----------
const idb = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open("dmonte", 1);
        r.onupgradeneeded = () => { r.result.createObjectStore("overrides"); r.result.createObjectStore("meta"); };
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch { res(); }
    });
  },
  tx(store, mode, fn) {
    return new Promise(res => {
      if (!this.db) return res(null);
      try {
        const t = this.db.transaction(store, mode), s = t.objectStore(store);
        const out = fn(s);
        t.oncomplete = () => res(out && "result" in out ? out.result : null);
        t.onerror = () => res(null);
      } catch { res(null); }
    });
  },
  all() {
    return new Promise(res => {
      if (!this.db) return res({});
      const out = {};
      try {
        const c = this.db.transaction("overrides").objectStore("overrides").openCursor();
        c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } else res(out); };
        c.onerror = () => res(out);
      } catch { res(out); }
    });
  },
  put(id, v) { return this.tx("overrides", "readwrite", s => s.put(v, id)); },
  del(id) { return this.tx("overrides", "readwrite", s => s.delete(id)); },
  clear() { return this.tx("overrides", "readwrite", s => s.clear()); },
  getMeta(k) { return this.tx("meta", "readonly", s => s.get(k)); },
  setMeta(k, v) { return this.tx("meta", "readwrite", s => s.put(v, k)); },
  delMeta(k) { return this.tx("meta", "readwrite", s => s.delete(k)); },
};

// ---------- State ----------
let PRODUCTS = [], STOCK = {}, byId = {}, OVERRIDES = {}, SCREEN = null, VIDEOS = {};
// Training disciplines: an explicit p.disciplines (set in the editor) wins; otherwise these name rules apply
const DISCIPLINES = ["Hyrox", "Crossfit"];
const DISC_RULES = {
  Hyrox: /cinta de correr autopropulsada|máquina de esquí|remo de aire|trineo/i,
  Crossfit: /crossfit|^rack|power rack|jaula de potencia|medio rack|multirack|bicicleta de aire|remo de aire|máquina de esquí|banco ghd|hiperextensión inversa|neumático|trineo/i,
};
const autoDisciplines = p => DISCIPLINES.filter(d => DISC_RULES[d].test(p.name || ""));
const disciplinesOf = p => Array.isArray(p.disciplines) ? p.disciplines : autoDisciplines(p);
const state = { disc: null, group: null, func: null, q: "", onlyStock: false, cart: loadCart(), open: new Set(), shown: PAGE, manage: false };

function rebuild() {
  const prods = BASE.products.map(clone);
  const stock = clone(BASE.stock || {});
  const idx = Object.fromEntries(prods.map((p, i) => [p.id, i]));
  for (const [id, o] of Object.entries(OVERRIDES)) {
    if (id.startsWith("__")) continue;   // not a machine (e.g. "__screen__")
    if (o.deleted) { if (id in idx) prods[idx[id]] = null; delete stock[id]; continue; }
    if (id in idx) prods[idx[id]] = o.product; else prods.push(o.product);
    stock[id] = o.stock || [];
  }
  PRODUCTS = prods.filter(Boolean);
  STOCK = stock;
  byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
  SCREEN = OVERRIDES.__screen__ ? OVERRIDES.__screen__.screen : (BASE.screen || null);
  VIDEOS = { ...(BASE.videos || {}), ...((OVERRIDES.__videos__ || {}).videos || {}) };
  const key = JSON.stringify(SCREEN);
  if (VM.screenKey !== key) { VM.screenKey = key; VM.slides = null; if (VM.on) vmSetSlides(); }
}
const stockOf = id => (STOCK[id] || []).reduce((s, v) => s + (+v.qty || 0), 0);

function loadCart() { try { return JSON.parse(localStorage.getItem("dmonte-selection") || "{}") || {}; } catch { return {}; } }
function saveCart() { try { localStorage.setItem("dmonte-selection", JSON.stringify(state.cart)); } catch {} }

function toast(msg, ms = 3000) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), ms);
}

// ---------- Filters ----------
function matches(p, { group = state.group, func = state.func, disc = state.disc } = {}) {
  if (disc && !disciplinesOf(p).includes(disc)) return false;
  if (group && p.group !== group) return false;
  if (func && !(p.functions || []).includes(func)) return false;
  if (state.onlyStock && stockOf(p.id) === 0) return false;
  if (state.q) {
    const hay = fold([p.model, p.name, p.name_cn, p.section, p.group, tr(p.section), tr(p.group), ...(p.functions || []), ...(p.functions || []).map(tr), ...disciplinesOf(p)].join(" "));
    if (!fold(state.q).split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

function renderFilters() {
  const groups = [...GROUP_ORDER.filter(g => PRODUCTS.some(p => p.group === g)),
    ...[...new Set(PRODUCTS.map(p => p.group))].filter(g => g && !GROUP_ORDER.includes(g))];
  const gRow = $("groupRow");
  gRow.innerHTML = '<span class="label">Grupo muscular</span>';
  gRow.append(chip("Todos", null, state.group === null, PRODUCTS.filter(p => matches(p, { group: null, func: null, disc: null })).length, v => { state.group = v; state.func = null; state.disc = null; }));
  groups.forEach(g => {
    const n = PRODUCTS.filter(p => matches(p, { group: g, func: null, disc: null })).length;
    if (n || state.group === g) gRow.append(chip(tr(g), g, state.group === g, n, v => { state.group = v; state.func = null; state.disc = null; }));
  });

  const funcs = [...new Set(PRODUCTS.filter(p => !state.group || p.group === state.group).flatMap(p => p.functions || []))].sort((a, b) => tr(a).localeCompare(tr(b), "es"));
  const fRow = $("funcRow");
  fRow.innerHTML = '<span class="label">Función principal</span>';
  fRow.append(chip("Todas", null, state.func === null && state.disc === null, null, () => { state.func = null; state.disc = null; }));
  DISCIPLINES.forEach(d => {   // Hyrox / Crossfit sit in this row but filter by discipline, not by function
    const n = PRODUCTS.filter(p => matches(p, { func: null, disc: d })).length;
    if (n || state.disc === d) fRow.append(chip(d, d, state.disc === d, n, v => { state.disc = v; state.func = null; }));
  });
  funcs.forEach(f => {
    const n = PRODUCTS.filter(p => matches(p, { func: f, disc: null })).length;
    if (n || state.func === f) fRow.append(chip(tr(f), f, state.func === f, n, v => { state.func = v; state.disc = null; }));
  });
}

function chip(label, value, pressed, n, onPick) {
  const b = document.createElement("button");
  b.className = "chip";
  b.setAttribute("aria-pressed", pressed);
  b.innerHTML = esc(label) + (n === null ? "" : `<span class="n">${n}</span>`);
  b.onclick = () => { onPick(value); state.shown = PAGE; render(); };
  return b;
}

// ---------- Grid ----------
function stockBadge(id) {
  const s = stockOf(id);
  return s > 0 ? `<span class="stock in">${s} en stock</span>` : `<span class="stock out">Sin stock</span>`;
}
function dimsText(p) {
  const d = p.dims || {};
  const parts = [];
  if (d.l || d.w || d.h) parts.push(`${d.l || "?"}×${d.w || "?"}×${d.h || "?"} mm`);
  if (p.weight) parts.push(`${String(p.weight).replace(".", ",")} kg`);
  return parts.join(" · ");
}
const picHtml = p => p.img ? `<img ${imgAttr(p.img)} alt="${esc(p.name)}" loading="lazy">` : `<span class="noimg">Sin imagen</span>`;

function renderGrid() {
  const list = PRODUCTS.filter(p => matches(p));
  $("resultCount").textContent = `${list.length} de ${PRODUCTS.length} máquinas`;
  const grid = $("grid");
  if (!list.length) { grid.innerHTML = '<div class="empty">Ninguna máquina coincide con estos filtros.</div>'; return; }
  grid.innerHTML = list.slice(0, state.shown).map(p => {
    const sel = p.id in state.cart;
    return `
    <article class="card ${sel ? "selected" : ""}">
      ${OVERRIDES[p.id] ? '<span class="edited">editada</span>' : ""}
      <button class="edit-btn" data-edit="${esc(p.id)}">Editar</button>
      <button class="pic" data-detail="${esc(p.id)}" aria-label="Ver ${esc(p.model)}">${picHtml(p)}</button>
      <div class="body">
        <div class="model">${esc(p.model)}</div>
        <div class="name">${esc(p.name) || "&nbsp;"}</div>
        <div class="tags">
          ${p.group ? `<span class="tag">${esc(tr(p.group))}</span>` : ""}
          ${disciplinesOf(p).map(d => `<span class="tag flag">${esc(d)}</span>`).join("")}
          ${(p.functions || []).map(f => `<span class="tag">${esc(tr(f))}</span>`).join("")}
          ${p.inCatalog === false ? '<span class="tag flag">No está en catálogo</span>' : ""}
        </div>
        <div class="specs">${esc(dimsText(p))}</div>
        <div class="foot">
          ${stockBadge(p.id)}
          <button class="add ${sel ? "on" : ""}" data-toggle="${esc(p.id)}">${sel ? "✓ Añadida" : "+ Añadir"}</button>
        </div>
      </div>
    </article>`;
  }).join("");
}
new IntersectionObserver(es => {
  if (es[0].isIntersecting && state.shown < PRODUCTS.filter(p => matches(p)).length) { state.shown += PAGE; renderGrid(); }
}, { rootMargin: "600px" }).observe($("sentinel"));

// ---------- Selection ----------
function toggleCart(id) {
  if (id in state.cart) delete state.cart[id]; else state.cart[id] = 1;
  saveCart(); renderGrid(); renderCart();
}
function setQty(id, q) { state.cart[id] = Math.max(1, Math.min(999, parseInt(q, 10) || 1)); saveCart(); renderCart(); }
function lineStatus(id, want) {
  const s = stockOf(id);
  if (s === 0) return { cls: "none", text: "Sin stock", short: want };
  if (want > s) return { cls: "short", text: `⚠ Faltan ${want - s}`, short: want - s };
  return { cls: "ok", text: "✓ Disponible", short: 0 };
}
function variantRow(v) {
  const note = [v.code && "Código " + v.code, v.batch, v.remark].filter(Boolean).map(esc).join(" · ");

// Keep typed values in the draft before re-rendering (e.g. when adding a stock row)
function readForm() {
  const f = $("editForm"); if (!f) return;
  const g = n => f.elements[n].value.trim();
  const num = n => g(n) === "" ? null : Number(g(n));
  const p = draft.product;
  p.model = g("model"); p.name = g("name"); p.name_cn = g("name_cn"); p.section = unTr(g("section")); p.group = unTr(g("group"));
  p.page = num("page"); p.weight = num("weight"); p.dims = { l: num("l"), w: num("w"), h: num("h") };
  p.functions = [...f.querySelectorAll('input[name="func"]:checked')].map(i => i.value)
    .concat(g("funcExtra").split(",").map(s => s.trim()).filter(Boolean));
  p.features = f.elements.features.value.split("\n").map(s => s.trim()).filter(Boolean);
  const disc = [...f.querySelectorAll('input[name="disc"]:checked')].map(i => i.value);   // only stored when it differs from the name rules
  if (disc.join() === autoDisciplines(p).join()) delete p.disciplines; else p.disciplines = disc;
  if (f.elements.video) { if (f.elements.video.value) p.video = f.elements.video.value; else delete p.video; }
  f.querySelectorAll("[data-v]").forEach(i => {
    const v = draft.stock[i.dataset.v];
    v[i.dataset.k] = i.dataset.k === "qty" ? Math.max(0, parseInt(i.value, 10) || 0) : i.value.trim();
  });
}

async function saveDraft() {
  readForm();
  const p = draft.product;
  if (!p.model) return renderEditor("El modelo es obligatorio.");
  const newId = draft.isNew ? normId(p.model) : draft.id;
  if (draft.isNew && byId[newId]) return renderEditor(`Ya existe una máquina con el modelo ${p.model}.`);
  p.id = newId;
  p.functions = [...new Set(p.functions)];
  const rec = { product: p, stock: draft.stock, updated: new Date().toISOString() };
  OVERRIDES[newId] = rec;
  await idb.put(newId, rec);
  rebuild(); closeModal(); render();
  toast(`${p.model} guardada en este navegador. ${window.DMONTE_ENC ? "Pulsa “Publicar cambios” para subirla a la web." : window.SINGLE_FILE ? "" : "Usa “Guardar en carpeta” para hacerlo permanente."}`);
}

async function deleteMachine() {
  if (!confirm(`¿Eliminar ${draft.product.model}?`)) return;
  const id = draft.id;
  if (BASE.products.some(b => b.id === id)) { OVERRIDES[id] = { deleted: true }; await idb.put(id, OVERRIDES[id]); }
  else { delete OVERRIDES[id]; await idb.del(id); }
  delete state.cart[id]; saveCart();
  rebuild(); closeModal(); render();
  toast("Máquina eliminada.");
}

async function revertMachine() {
  delete OVERRIDES[draft.id]; await idb.del(draft.id);
  rebuild(); closeModal(); render();
  toast("Se han restaurado los datos originales.");
}

function resizeImage(file, max = 900, bg = "#fff") {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const g = c.getContext("2d");
        g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.85));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function dataJs() {
  const out = { generated: new Date().toISOString().slice(0, 10), products: PRODUCTS, stock: {} };
  if (SCREEN) out.screen = SCREEN;
  PRODUCTS.forEach(p => { if ((STOCK[p.id] || []).length) out.stock[p.id] = STOCK[p.id]; });
  return "window.CATALOG_DATA = " + JSON.stringify(out) + ";\n";
}
async function committed() {
  BASE.products = clone(PRODUCTS); BASE.stock = clone(STOCK); BASE.screen = SCREEN ? clone(SCREEN) : undefined;
  OVERRIDES = {}; await idb.clear(); rebuild(); render();
}
// Never write a data.js when the original one did not load: it would replace the catalog with an empty one
function dataLoaded() {
  if (BASE.products.length) return true;
  toast("No se cargó data.js, así que no se ha guardado nada. Abre index.html desde la carpeta que contiene data.js.", 8000);
  return false;
}
async function saveToFolder() {
  if (!dataLoaded()) return;
  if (!window.showDirectoryPicker) {
    toast("Este navegador no puede escribir en carpetas. Usa “Descargar data.js” y sustituye el archivo en Catalogo_Web.", 6000);
    return;
  }
  try {
    let dir = await idb.getMeta("dir");
    if (dir && (await dir.requestPermission({ mode: "readwrite" })) !== "granted") dir = null;
    if (!dir) {
      toast("Elige la carpeta Catalogo_Web (la que contiene index.html).", 5000);
      dir = await window.showDirectoryPicker({ id: "dmonte", mode: "readwrite" });
    }
    try { await dir.getFileHandle("index.html"); }
    catch { toast("Esa carpeta no tiene index.html. Elige la carpeta Catalogo_Web.", 6000); await idb.setMeta("dir", null); return; }
    await idb.setMeta("dir", dir);
    try {   // keep a backup of the previous data.js
      const old = await (await (await dir.getFileHandle("data.js")).getFile()).text();
      const bk = await (await dir.getDirectoryHandle("backups", { create: true })).getFileHandle(`data_${new Date().toISOString().replace(/[:.]/g, "-")}.js`, { create: true });
      const w0 = await bk.createWritable(); await w0.write(old); await w0.close();
    } catch {}
    const fh = await dir.getFileHandle("data.js", { create: true });
    const w = await fh.createWritable(); await w.write(dataJs()); await w.close();
    await committed();
    toast("Guardado en data.js ✓ (la versión anterior queda en /backups)");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    toast("No se pudo guardar en la carpeta: " + (e && e.message || e) + ". Usa “Descargar data.js”.", 7000);
  }
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

            <div class="seg" role="group" aria-label="Horizonte temporal">
              ${Object.entries(CALC_PERIODS).map(([k, p]) => `<button type="button" data-period="${k}" aria-pressed="${calc.period === k}">${p.label}</button>`).join("")}
            </div>
            <p class="hint" id="calcMult"></p>
          </div>
          ${CALC_FIELDS.map(g => `
          <fieldset class="calc-group">
            <legend><span class="dot" style="background:${g.color}"></span>${g.group}</legend>
            ${g.fields.map(f => `
            <label class="field"><span>${f.label}</span>
              <span class="in"><input type="number" step="any" inputmode="decimal" data-calc="${f.k}" value="${esc(calc[f.k])}"><span class="unit">${f.unit}</span></span>
            </label>`).join("")}
            ${g.hint ? `<p class="hint" style="margin:0">${g.hint}</p>` : ""}
          </fieldset>`).join("")}
        </form>
        <div class="calc-results">
          <div class="kpis">
            <div class="kpi"><span class="k-lbl"><span class="dot" style="background:var(--c-cost)"></span>Gastos totales</span><span class="k-val" id="kGastos"></span><span class="k-desc" id="kGastosD"></span></div>
            <div class="kpi"><span class="k-lbl"><span class="dot" style="background:var(--c-income)"></span>Ingresos comisión</span><span class="k-val" id="kIngresos"></span><span class="k-desc" id="kIngresosD"></span></div>
            <div class="kpi net"><span class="k-lbl"><span class="dot" style="background:var(--c-net)"></span>Beneficio neto</span><span class="k-val" id="kNeto"></span><span class="k-desc">Ingresos − gastos</span></div>
          </div>
          <div class="bars"><div class="bars-title">Comparativa del periodo</div><div id="calcBars" style="display:grid;gap:14px"></div></div>
        </div>
      </div>
    </div>`;
  renderCalc();
}

function renderCalc() {
  if (!$("calcForm")) return;
  const v = k => parseFloat(calc[k]) || 0;
  const per = CALC_PERIODS[calc.period] || CALC_PERIODS["30d"], days = per.days;
  // Costs = daily kWh × €/kWh × days · Income = daily sales × price × commission% × days · Net = income − costs
  const kwh = v("consumo") * days;
  const gastos = kwh * v("precio_kwh");
  const uds = v("num_ventas") * days;
  const bruto = uds * v("precio_venta");
  const ingresos = bruto * (v("comision_pct") / 100);
  const neto = ingresos - gastos;

  document.querySelectorAll("[data-period]").forEach(b => b.setAttribute("aria-pressed", b.dataset.period === calc.period));
  $("calcMult").textContent = per.desc;
  $("kGastos").textContent = eur(gastos);
  $("kGastosD").textContent = `${kwh.toLocaleString("es-ES", { maximumFractionDigits: 1 })} kWh acumulados`;
  $("kIngresos").textContent = eur(ingresos);
  $("kIngresosD").textContent = `${uds.toLocaleString("es-ES", { maximumFractionDigits: 2 })} ventas acumuladas`;
  $("kNeto").textContent = eur(neto);
  $("kNeto").className = "k-val " + (neto >= 0 ? "pos" : "neg");

  const rows = [["Gastos energéticos", gastos, "var(--c-cost)"], ["Ingreso por comisión", ingresos, "var(--c-income)"], ["Beneficio neto", neto, neto >= 0 ? "var(--c-net)" : "var(--warn)"]];
  const hi = Math.max(0, ...rows.map(r => r[1])), lo = Math.min(0, ...rows.map(r => r[1])), range = hi - lo || 1;
  const zero = -lo / range * 100;
  $("calcBars").innerHTML = rows.map(([label, val, color]) => {
    const w = Math.abs(val) / range * 100, left = val < 0 ? zero - w : zero;
    return `<div class="bar-row"><span>${label}</span><span class="b-val">${eur(val)}</span>
      <div class="bar-track">${lo < 0 ? `<span class="zero" style="left:${zero}%"></span>` : ""}<span class="bar" style="left:${left}%;width:${w}%;background:${color}"></span></div></div>`;
  }).join("");
}

// ---------- Encrypted web version ----------
// The published copy (GitHub Pages) holds no readable data: data.enc.js has the catalogue encrypted with
// AES-GCM (key derived from the password with PBKDF2) and every photo is its own img/<id>.js file.
// Everything is loaded through <script> tags so a downloaded copy of the folder also works from file://.
const KDF_ITER = 600000;
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
const WEB = { aes: null, urls: {}, waiting: {}, pending: {}, queue: [], active: 0 };
const b64 = {
  enc: u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
};
const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, "0")).join("");

async function deriveKeys(password, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  return keysFromRaw(new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: KDF_ITER }, base, 512)));
}
async function keysFromRaw(raw) {
  return {
    raw,
    aes: await crypto.subtle.importKey("raw", raw.slice(0, 32), "AES-GCM", false, ["encrypt", "decrypt"]),
    hmac: await crypto.subtle.importKey("raw", raw.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]),
  };
}
async function seal(aes, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aes, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function unseal(aes, packed) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: packed.subarray(0, 12) }, aes, packed.subarray(12)));
}
async function gzip(bytes, inflate) {
  const s = new Blob([bytes]).stream().pipeThrough(inflate ? new DecompressionStream("gzip") : new CompressionStream("gzip"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function openEnvelope(keys, env) {
  let bytes = await unseal(keys.aes, b64.dec(env.data));
  if (env.z) bytes = await gzip(bytes, true);
  return JSON.parse(new TextDecoder().decode(bytes));
}

// Password screen shown before anything else on the published copy
function unlock() {
  const E = window.DMONTE_ENC;
  return new Promise(async resolve => {
    const done = (keys, data) => { WEB.aes = keys.aes; WEB.keys = keys; Object.assign(BASE, data); resolve(); };
    try {   // key remembered on this device
      const saved = JSON.parse(localStorage.getItem("dmonte-key") || "null");
      if (saved && saved.salt === E.salt) { const keys = await keysFromRaw(b64.dec(saved.key)); return done(keys, await openEnvelope(keys, E)); }
    } catch {}
    const box = document.createElement("div");
    box.className = "lock";
    box.innerHTML = `
      <form autocomplete="on">
        <span class="logo" role="img" aria-label="Logotipo de D'Monte"></span>
        <h2>D'Monte <span>Equipamiento</span></h2>
        <p>Catálogo privado. Introduce la contraseña para entrar.</p>
        <input type="text" name="username" value="D'Monte" autocomplete="username" hidden>
        <input type="password" name="pw" placeholder="Contraseña" autocomplete="current-password" required autofocus>
        <label class="toggle"><input type="checkbox" name="remember"> Recordar en este dispositivo</label>
        <button class="btn accent" type="submit">Entrar</button>
        <div class="err" aria-live="polite"></div>
      </form>`;
    document.body.append(box);
    const form = box.querySelector("form"), btn = form.querySelector("button"), err = form.querySelector(".err");
    form.onsubmit = async e => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = "Comprobando…"; err.textContent = "";
      try {
        const keys = await deriveKeys(form.elements.pw.value, b64.dec(E.salt));
        const data = await openEnvelope(keys, E);
        if (form.elements.remember.checked) try { localStorage.setItem("dmonte-key", JSON.stringify({ salt: E.salt, key: b64.enc(keys.raw) })); } catch {}
        box.remove(); done(keys, data);
      } catch {
        err.textContent = "Contraseña incorrecta.";
        btn.disabled = false; btn.textContent = "Entrar"; form.elements.pw.select();
      }
    };
  });
}

// Photos: "enc:<id>" -> img/<id>.js, decrypted on demand into a blob: URL
const isEnc = s => typeof s === "string" && s.startsWith("enc:");
function imgAttr(s) {
  if (!isEnc(s)) return `src="${esc(s)}"`;
  const id = s.slice(4);
  return `src="${WEB.urls[id] || (loadImg(id), BLANK)}" data-enc="${esc(id)}"`;
}
function loadImg(id) {
  if (WEB.urls[id]) return Promise.resolve(WEB.urls[id]);
  if (!WEB.waiting[id]) WEB.waiting[id] = new Promise(res => { WEB.queue.push({ id, res }); pumpImgs(); });
  return WEB.waiting[id];
}
function pumpImgs() {
  while (WEB.active < 6 && WEB.queue.length) {
    const job = WEB.queue.shift(), s = document.createElement("script");
    WEB.active++;
    const finish = url => { WEB.active--; s.remove(); job.res(url); pumpImgs(); };
    WEB.pending[job.id] = finish;
    s.onerror = () => { if (WEB.pending[job.id]) { delete WEB.pending[job.id]; finish(BLANK); } };
    s.src = `img/${job.id}.js`;
    document.head.append(s);
  }
}
window.DMONTE_IMG = async (id, mime, data) => {
  const finish = WEB.pending[id];
  if (!finish) return;
  delete WEB.pending[id];
  let url = BLANK;
  try { url = URL.createObjectURL(new Blob([await unseal(WEB.aes, b64.dec(data))], { type: mime })); } catch {}
  WEB.urls[id] = url;
  document.querySelectorAll(`img[data-enc="${id}"]`).forEach(i => { i.src = url; });
  finish(url);
};
const waitImgs = root => Promise.all([...root.querySelectorAll("img[data-enc]")].map(i => loadImg(i.dataset.enc)));

// ---------- Building the encrypted web copy (local version only) ----------
// Everything is built in memory and downloaded as one ZIP: writing ~850 files one by one through the
// File System Access API is very slow (Chrome checks every file it writes).
// readFile(path) -> bytes of a file inside Catalogo_Web
async function buildWebFiles(password, readFile, progress) {
  const srcHtml = new TextDecoder().decode(await readFile("index.html"));
  const tagIn = '<script src="data.js"><\/script>', tagOut = '<script src="data.enc.js"><\/script>';
  if (!srcHtml.includes(tagIn)) throw new Error("index.html no tiene el formato esperado");
  progress("Generando la clave…");
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const keys = await deriveKeys(password, salt);
  const enc = new TextEncoder(), files = [];

  const refs = new Set();
  PRODUCTS.forEach(p => p.img && refs.add(p.img));
  Object.values(STOCK).forEach(vs => vs.forEach(v => v.img && refs.add(v.img)));
  (SCREEN || []).forEach(s => s.img && refs.add(s.img));
  const map = {}, done = new Set();
  let n = 0, missing = 0;
  for (const ref of refs) {
    if (++n % 10 === 0 || n === refs.size) progress(`Cifrando fotos ${n} de ${refs.size}…`);
    let bytes, mime;
    try {
      if (ref.startsWith("data:")) { mime = ref.slice(5, ref.indexOf(";")); bytes = b64.dec(ref.slice(ref.indexOf(",") + 1)); }
      else { bytes = await readFile(ref); mime = /\.png$/i.test(ref) ? "image/png" : /\.webp$/i.test(ref) ? "image/webp" : "image/jpeg"; }
    } catch { missing++; continue; }
    const id = hex(new Uint8Array(await crypto.subtle.sign("HMAC", keys.hmac, bytes)).slice(0, 16));
    map[ref] = "enc:" + id;
    if (done.has(id)) continue;
    done.add(id);
    files.push({ name: `img/${id}.js`, data: enc.encode(`DMONTE_IMG("${id}","${mime}","${b64.enc(await seal(keys.aes, bytes))}");\n`) });
  }

  progress("Cifrando los datos…");
  const out = { generated: new Date().toISOString().slice(0, 10), products: clone(PRODUCTS), stock: {} };
  out.products.forEach(p => { p.img = map[p.img] || ""; });
  PRODUCTS.forEach(p => { if ((STOCK[p.id] || []).length) out.stock[p.id] = clone(STOCK[p.id]).map(v => ({ ...v, img: map[v.img] || "" })); });
  if (SCREEN) out.screen = SCREEN.map(s => s.img ? { ...s, img: map[s.img] || "" } : s);
  let bytes = enc.encode(JSON.stringify(out));
  const z = typeof CompressionStream === "function";
  if (z) bytes = await gzip(bytes);
  const env = { v: 1, kdf: "PBKDF2-SHA256", iter: KDF_ITER, salt: b64.enc(salt), z: z ? 1 : 0, data: b64.enc(await seal(keys.aes, bytes)) };
  files.unshift(
    { name: "index.html", data: enc.encode(srcHtml.replace(tagIn, tagOut)) },
    { name: "data.enc.js", data: enc.encode("window.DMONTE_ENC = " + JSON.stringify(env) + ";\n") },
    { name: ".nojekyll", data: new Uint8Array(0) },
  );
  for (const p of PWA_FILES) { try { files.push({ name: p, data: await readFile(p) }); } catch {} }   // installable-app files
  progress("Preparando el ZIP…");
  return { zip: zipStore(files), photos: done.size, missing, machines: out.products.length };
}

// Minimal ZIP writer (no compression: the content is encrypted and would not shrink anyway)
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {
  const now = new Date(), parts = [], central = [], utf8 = new TextEncoder();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let offset = 0, cdSize = 0;
  for (const f of files) {
    const name = utf8.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
    h.setUint32(18, size, true); h.setUint32(22, size, true); h.setUint16(26, name.length, true);
    parts.push(h.buffer, name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true);
    c.setUint32(20, size, true); c.setUint32(24, size, true); c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(c.buffer, name);
    offset += 30 + name.length + size; cdSize += 46 + name.length;
  }
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, e.buffer], { type: "application/zip" });
}

async function readFrom(dir, path) {
  const parts = path.split("/");
  for (const p of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(decodeURIComponent(p));
  return new Uint8Array(await (await (await dir.getFileHandle(decodeURIComponent(parts[parts.length - 1]))).getFile()).arrayBuffer());
}

// ---------- Publishing to GitHub (editor devices only) ----------
// The editor saves a fine-grained token (Contents: read & write on the site repository) in this browser only.
// “Publicar cambios” (web) commits the new data.enc.js plus any new photos in one commit through the Git Data API;
// “Publicar app” (local) replaces index.html only. GitHub Pages redeploys by itself after each commit.
const GH = {
  cfg() { try { return JSON.parse(localStorage.getItem("dmonte-gh") || "null"); } catch { return null; } },
  async api(path, opts = {}, cfg = GH.cfg()) {
    const headers = { Accept: opts.raw ? "application/vnd.github.raw" : "application/vnd.github+json", Authorization: `Bearer ${cfg.token}`, "X-GitHub-Api-Version": "2022-11-28" };
    if (opts.body) headers["Content-Type"] = "application/json";
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}${path}`, { method: opts.method || "GET", headers, body: opts.body, cache: "no-store" });
    if (!r.ok) {
      let m = ""; try { m = (await r.json()).message; } catch {}
      const e = new Error(r.status === 401 ? "el token no es válido o ha caducado" : r.status === 403 || r.status === 404 ? "el token no tiene acceso a ese repositorio" : `GitHub respondió ${r.status}${m ? ` (${m})` : ""}`);
      e.status = r.status; throw e;
    }
    return opts.raw ? r.text() : r.status === 204 ? null : r.json();
  },
  // files: [{ path, content }] to add or replace, [{ path, content: null }] to delete
  async commit(files, message, cfg = GH.cfg(), progress) {
    const ref = await GH.api(`/git/ref/heads/${encodeURIComponent(cfg.branch)}`, {}, cfg);
    const head = await GH.api(`/git/commits/${ref.object.sha}`, {}, cfg);
    const tree = [];
    let done = 0;
    for (const f of files) {
      if (progress) progress(++done, files.length);
      if (f.content === null) { tree.push({ path: f.path, mode: "100644", type: "blob", sha: null }); continue; }
      const blob = await GH.api("/git/blobs", { method: "POST", body: JSON.stringify({ content: f.content, encoding: f.base64 ? "base64" : "utf-8" }) }, cfg);
      tree.push({ path: f.path, mode: "100644", type: "blob", sha: blob.sha });
    }
    const t = await GH.api("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: head.tree.sha, tree }) }, cfg);
    const c = await GH.api("/git/commits", { method: "POST", body: JSON.stringify({ message, tree: t.sha, parents: [ref.object.sha] }) }, cfg);
    await GH.api(`/git/refs/heads/${encodeURIComponent(cfg.branch)}`, { method: "PATCH", body: JSON.stringify({ sha: c.sha }) }, cfg);   // fails if the branch moved meanwhile
  },
};
const canEdit = () => !window.DMONTE_ENC || !!GH.cfg();

  $("manageBtn").hidden = web && !editor;

// Same encrypted formats as buildWebFiles
async function photoFile(keys, bytes, mime) {
  const id = hex(new Uint8Array(await crypto.subtle.sign("HMAC", keys.hmac, bytes)).slice(0, 16));
  return { id, content: `DMONTE_IMG("${id}","${mime}","${b64.enc(await seal(keys.aes, bytes))}");\n` };
}
async function makeEnvelope(keys, salt, obj) {
  let bytes = new TextEncoder().encode(JSON.stringify(obj));
  const z = typeof CompressionStream === "function";
  if (z) bytes = await gzip(bytes);
  return { v: 1, kdf: "PBKDF2-SHA256", iter: KDF_ITER, salt, z: z ? 1 : 0, data: b64.enc(await seal(keys.aes, bytes)) };
}

async function publishChanges() {
  const cfg = GH.cfg();
  if (!cfg) return openGhSetup();
  const n = pendingCount();
  if (!n) return toast("No hay cambios que publicar.");
  const pend = Object.entries(VIDEOS).filter(([, v]) => v.pending), pendMB = pend.reduce((s, [, v]) => s + (v.bytes || 0), 0);
  if (!confirm(`¿Publicar ${n} cambio${n > 1 ? "s" : ""} en la web?${pend.length ? ` Se subirán ${pend.length} vídeo${pend.length > 1 ? "s" : ""} (${mbText(pendMB)}), puede tardar unos minutos.` : ""} Todos los que tengan el enlace los verán en unos minutos.`)) return;
  const btn = $("publishBtn"); btn.disabled = true; btn.textContent = "Publicando…";
  try {
    // Someone may have published from another device since this page was opened
    const remote = await GH.api(`/contents/data.enc.js?ref=${encodeURIComponent(cfg.branch)}`, { raw: true }, cfg);
    if (JSON.parse(remote.slice(remote.indexOf("{"), remote.lastIndexOf("}") + 1)).data !== window.DMONTE_ENC.data)
      throw new Error("la web publicada ha cambiado desde que abriste esta página (quizá desde otro dispositivo). Usa “Exportar copia”, recarga la página, importa la copia y vuelve a publicar");

    const keys = WEB.keys, files = [], fresh = {}, used = new Set();
    const toEnc = async ref => {   // photos added in the editor are data: URLs -> new encrypted files
      if (isEnc(ref)) { used.add(ref.slice(4)); return ref; }
      if (!ref || !ref.startsWith("data:")) return "";
      const mime = ref.slice(5, ref.indexOf(";")), bytes = b64.dec(ref.slice(ref.indexOf(",") + 1));
      const f = await photoFile(keys, bytes, mime);
      if (!used.has(f.id)) { files.push({ path: `img/${f.id}.js`, content: f.content }); fresh[f.id] = URL.createObjectURL(new Blob([bytes], { type: mime })); }
      used.add(f.id);
      return "enc:" + f.id;
    };
    const products = clone(PRODUCTS), stock = {};
    for (const p of products) p.img = await toEnc(p.img);
    for (const p of PRODUCTS) if ((STOCK[p.id] || []).length) {
      stock[p.id] = [];
      for (const v of clone(STOCK[p.id])) stock[p.id].push({ ...v, img: await toEnc(v.img) });
    }
    const screen = SCREEN ? [] : null;   // screen slides: new images get encrypted like machine photos
    for (const s of SCREEN || []) screen.push(s.img ? { ...s, img: await toEnc(s.img) } : s);
    // Videos added on this device: encrypt and upload them; already published ones stay as they are
    const videos = clone(BASE.videos || {});
    let k = 0;
    for (const [id, v] of pend) {
      btn.textContent = `Cifrando vídeos ${++k}/${pend.length}…`;
      const blob = await idb.getMeta(vidKey(id));
      if (!blob) continue;
      const content = `DMONTE_VID("${id}","${blob.type || "video/mp4"}","${b64.enc(await seal(keys.aes, new Uint8Array(await blob.arrayBuffer())))}");\n`;
      files.push({ path: `vid/${id}.js`, content });
      videos[id] = { name: v.name, size: content.length };
    }
    // Photos no machine uses any more
    const tree = await GH.api(`/git/trees/${encodeURIComponent(cfg.branch)}?recursive=1`, {}, cfg);
    for (const t of tree.tree) {
      const m = /^img\/([0-9a-f]{32})\.js$/.exec(t.path);
      if (m && !used.has(m[1])) files.push({ path: t.path, content: null });
    }
    const env = await makeEnvelope(keys, window.DMONTE_ENC.salt, { generated: new Date().toISOString().slice(0, 10), products, stock, ...(screen ? { screen } : {}), ...(Object.keys(videos).length ? { videos } : {}) });
    files.push({ path: "data.enc.js", content: "window.DMONTE_ENC = " + JSON.stringify(env) + ";\n" });
    await GH.commit(files, `Actualizar catálogo (${n} cambio${n > 1 ? "s" : ""})`, cfg, (i, all) => { btn.textContent = `Subiendo ${i}/${all}…`; });

    Object.assign(WEB.urls, fresh);
    window.DMONTE_ENC = env;
    BASE.products = products; BASE.stock = stock; BASE.screen = screen || undefined; BASE.videos = videos;
    for (const [id] of pend) await idb.delMeta(vidKey(id));
    OVERRIDES = {}; await idb.clear(); rebuild(); render();
    toast("Publicado ✓. Los demás verán los cambios en unos minutos.", 6000);
  } catch (e) {
    toast("No se pudo publicar: " + e.message + ".", 10000);
  } finally { btn.disabled = false; btn.textContent = "Publicar cambios"; }
}

// Catalogo_Web folder handle (stored when first chosen); asks for permission or the folder when needed
async function catalogDir(say) {
  let src = await idb.getMeta("dir");
  if (src && (await src.queryPermission({ mode: "readwrite" })) !== "granted" && (await src.requestPermission({ mode: "readwrite" })) !== "granted") src = null;
  if (!src) {
    say("Elige la carpeta Catalogo_Web (la que tiene index.html y data.js).");
    src = await window.showDirectoryPicker({ id: "dmonte", mode: "readwrite" });
    try { await src.getFileHandle("data.js"); await src.getFileHandle("index.html"); }
    catch { throw new Error("esa carpeta no es Catalogo_Web (no tiene index.html y data.js)"); }
    await idb.setMeta("dir", src);
  }
  return src;
}

// ---------- 3D size viewer ----------
// Orthographic view of the machine's bounding box (real length × width × height) on a 50 cm floor grid, with a
// 1.75 m person for scale and an optional use/safety zone around it. Plain canvas: no libraries, works offline.
const CLEARANCES = [[0, "Sin zona"], [0.3, "30 cm"], [0.6, "60 cm"], [1, "1 m"]];
let V3 = null;
const has3D = p => { const d = p.dims || {}; return d.l > 0 && d.w > 0 && d.h > 0; };
const meters = n => n.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " m";
const sqm = n => n.toLocaleString("es-ES", { maximumFractionDigits: 2 }) + " m²";
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function open3D(id) {
  const p = byId[id];
  if (!p || !has3D(p)) return;
  stop3D();
  let clear = 0.6;
  try { const c = parseFloat(localStorage.getItem("dmonte-clear")); if (CLEARANCES.some(x => x[0] === c)) clear = c; } catch {}
  V3 = { p, L: p.dims.l / 1000, W: p.dims.w / 1000, H: p.dims.h / 1000, clear, az: -0.6, el: 0.5, zoom: 1, img: null, ptrs: new Map(), raf: 0 };
  $("modalBox").classList.add("wide");
  $("modalBox").innerHTML = `
    <div class="calc">
      <div class="calc-head">
        <div><h3>Vista 3D · ${esc(p.model)}</h3><p>${esc(p.name)}</p></div>
        <button class="icon-btn" data-close aria-label="Cerrar">×</button>
      </div>
      <canvas id="v3c" class="v3-canvas" role="img" aria-label="Espacio que ocupa ${esc(p.model)} en 3D"></canvas>
      <div class="v3-bar">
        <div class="seg" role="group" aria-label="Zona de uso">${CLEARANCES.map(([v, l]) => `<button type="button" data-clear="${v}" aria-pressed="${v === clear}">${l}</button>`).join("")}</div>
        <button type="button" class="btn accent small" id="arBtn" hidden>Ver en mi sala (cámara)</button>
        <button type="button" class="btn small" id="v3reset">Restablecer vista</button>
        <button type="button" class="btn ghost small" data-back3d="${esc(id)}">Volver a la ficha</button>
      </div>
      <p class="hint" style="margin:0">Arrastra para girar; rueda o pellizco para acercar. La caja tiene las medidas máximas de la máquina; la persona mide 1,75 m.</p>
      <p class="hint" id="arHint" style="margin:0" hidden>La vista con cámara (ver la máquina en tu sala) funciona en móviles Android con Chrome, abriendo la web publicada.</p>
      <div class="v3-info" id="v3info"></div>
    </div>`;
  $("modal").classList.add("open");
  info3D();
  setupARButton();

  const c = $("v3c");
  c.addEventListener("pointerdown", e => { c.setPointerCapture(e.pointerId); V3.ptrs.set(e.pointerId, [e.clientX, e.clientY]); });
  c.addEventListener("pointermove", e => {
    if (!V3 || !V3.ptrs.has(e.pointerId)) return;
    const prev = V3.ptrs.get(e.pointerId), cur = [e.clientX, e.clientY];
    if (V3.ptrs.size === 1) {
      V3.az += (cur[0] - prev[0]) * 0.01;
      V3.el = clamp(V3.el + (cur[1] - prev[1]) * 0.006, 0.08, 1.3);
    } else if (V3.ptrs.size === 2) {   // pinch
      const other = [...V3.ptrs.values()].find(v => v !== prev);

    V3.ptrs.set(e.pointerId, cur);
    request3D();
  });

  c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
  c.addEventListener("wheel", e => { e.preventDefault(); V3.zoom = clamp(V3.zoom * Math.exp(-e.deltaY * 0.0015), 0.5, 4); request3D(); }, { passive: false });
  c.addEventListener("dblclick", reset3D);
  V3.ro = new ResizeObserver(() => request3D());
  V3.ro.observe(c);

  (async () => {   // the photo goes on the long faces of the box
    const src = isEnc(p.img) ? await loadImg(p.img.slice(4)) : p.img;
    if (!src || src === BLANK) return;
    const im = new Image();
    im.onload = () => { if (V3 && V3.p === p) { V3.img = im; request3D(); } };

}

function stop3D() {
  if (V3) { if (V3.ro) V3.ro.disconnect(); cancelAnimationFrame(V3.raf); }

}
function reset3D() { if (!V3) return; V3.az = -0.6; V3.el = 0.5; V3.zoom = 1; request3D(); }
function request3D() { if (V3 && !V3.raf) V3.raf = requestAnimationFrame(() => { if (V3) { V3.raf = 0; draw3D(); } }); }

function setClearance(v) {
  V3.clear = v;
  try { localStorage.setItem("dmonte-clear", String(v)); } catch {}
  document.querySelectorAll("[data-clear]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.clear === v));
  info3D(); request3D();
}

function info3D() {
  const { L, W, H, clear, p } = V3;
  const rows = [
    ["Medidas (largo × ancho × alto)", `${meters(L)} × ${meters(W)} × ${meters(H)}`],
    ["Superficie que ocupa", sqm(L * W)],
  ];
  if (clear) rows.push([`Con zona de uso de ${CLEARANCES.find(c => c[0] === clear)[1]}`, `${meters(L + 2 * clear)} × ${meters(W + 2 * clear)} = ${sqm((L + 2 * clear) * (W + 2 * clear))}`]);
  if (p.weight) rows.push(["Peso", `${String(p.weight).replace(".", ",")} kg`]);
  $("v3info").innerHTML = rows.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("");
}

function draw3D() {
  const c = $("v3c");
  if (!V3 || !c) return;
  const dpr = window.devicePixelRatio || 1, cw = c.clientWidth, ch = c.clientHeight;
  if (!cw || !ch) return;
  if (c.width !== Math.round(cw * dpr) || c.height !== Math.round(ch * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, cw, ch);
  const css = getComputedStyle(document.documentElement), tok = n => css.getPropertyValue(n).trim(), dark = isDark();
  const { L, W, H, clear, az, el } = V3;
  const ca = Math.cos(az), sa = Math.sin(az), ce = Math.cos(el), se = Math.sin(el);

  // Scene: box from (0,0,0) to (L,W,H), x = length, y = width, z = up; the person stands to the right of the box
  const px = L + clear + 0.45, py = W / 2;
  const snap = (v, up) => (up ? Math.ceil(v / 0.5) : Math.floor(v / 0.5)) * 0.5;   // floor area aligned to the 50 cm grid
  const ext = { x0: snap(-clear - 0.25), x1: snap(px + 0.45, 1), y0: snap(-clear - 0.25), y1: snap(W + clear + 0.25, 1) };
  const mx = (ext.x0 + ext.x1) / 2, my = (ext.y0 + ext.y1) / 2, top = Math.max(H, 1.85), mz = top / 2;
  // Scale fitted to the scene as seen from the default angle, so it stays constant while rotating
  const fit = (() => {
    const a = Math.cos(-0.6), b = Math.sin(-0.6), e1 = Math.cos(0.5), e2 = Math.sin(0.5);
    const pts = [[ext.x0, ext.y0, 0], [ext.x1, ext.y0, 0], [ext.x1, ext.y1, 0], [ext.x0, ext.y1, 0], [0, 0, H], [L, 0, H], [L, W, H], [0, W, H], [px, py, 1.95]];
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const [x, y, z] of pts) {
      const X = x - mx, Y = y - my, sx = X * a - Y * b, sy = -(X * b + Y * a) * e2 - (z - mz) * e1;
      x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
    }
    return { k: Math.min(cw / (x1 - x0), ch / (y1 - y0)), ox: (x0 + x1) / 2, oy: (y0 + y1) / 2 };
  })();
  const S = fit.k * 0.9 * V3.zoom;
  const P = (x, y, z) => {   // orthographic projection -> [screen x, screen y, depth (bigger = closer)]
    const X = x - mx, Y = y - my, xr = X * ca - Y * sa, yr = X * sa + Y * ca;
    return [cw / 2 + (xr - fit.ox) * S, ch / 2 + (-yr * se - (z - mz) * ce - fit.oy) * S, -yr * ce + z * se];
  };
  const poly = pts => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };

  // Floor grid, 50 cm cells (darker every metre)
  const step = 0.5, gx0 = ext.x0, gx1 = ext.x1, gy0 = ext.y0, gy1 = ext.y1;
  g.lineWidth = 1;
  const line = (a, b, strong) => { g.strokeStyle = dark ? (strong ? "rgba(255,255,255,.14)" : "rgba(255,255,255,.06)") : (strong ? "rgba(0,0,0,.14)" : "rgba(0,0,0,.06)"); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); };
  const whole = v => Math.abs(v - Math.round(v)) < 1e-6;
  for (let x = gx0; x <= gx1 + 1e-9; x += step) line(P(x, gy0, 0), P(x, gy1, 0), whole(x));
  for (let y = gy0; y <= gy1 + 1e-9; y += step) line(P(gx0, y, 0), P(gx1, y, 0), whole(y));

  // Use zone and footprint
  if (clear) {
    poly([P(-clear, -clear, 0), P(L + clear, -clear, 0), P(L + clear, W + clear, 0), P(-clear, W + clear, 0)]);
    g.fillStyle = dark ? "rgba(61,99,230,.18)" : "rgba(20,56,176,.10)"; g.fill();
    g.setLineDash([6, 4]); g.strokeStyle = tok("--accent"); g.lineWidth = 1.5; g.stroke(); g.setLineDash([]);
  }
  poly([P(0, 0, 0), P(L, 0, 0), P(L, W, 0), P(0, W, 0)]);
  g.fillStyle = dark ? "rgba(0,0,0,.45)" : "rgba(0,0,0,.12)"; g.fill();

  // Person (billboard) drawn before or after the box depending on which is closer
  const feet = P(px, py, 0), boxMid = P(L / 2, W / 2, H / 2);
  const person = () => {
    g.save(); g.translate(feet[0], feet[1]); g.scale(S, -S * ce);
    g.fillStyle = dark ? "rgba(244,244,245,.55)" : "rgba(24,24,27,.5)";
    const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); g.fill(); };
    g.beginPath(); g.ellipse(0, 1.63, 0.11, 0.11, 0, 0, Math.PI * 2); g.fill();
    rr(-0.2, 0.86, 0.4, 0.64, 0.08);
    rr(-0.18, 0, 0.16, 0.92, 0.06); rr(0.02, 0, 0.16, 0.92, 0.06);
    rr(-0.3, 0.84, 0.09, 0.64, 0.045); rr(0.21, 0.84, 0.09, 0.64, 0.045);
    g.restore();
    label(feet[0], feet[1] - 1.9 * S * ce - 4, "1,75 m");
  };
  const label = (x, y, text) => {
    g.font = "600 12px Inter, 'Segoe UI', system-ui, sans-serif";
    const w = g.measureText(text).width + 12;
    g.fillStyle = dark ? "rgba(24,24,27,.9)" : "rgba(255,255,255,.92)";
    g.beginPath(); g.roundRect ? g.roundRect(x - w / 2, y - 10, w, 20, 10) : g.rect(x - w / 2, y - 10, w, 20); g.fill();
    g.fillStyle = tok("--ink"); g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, x, y + 0.5);
  };
  if (feet[2] < boxMid[2]) person();

  // Box: only the faces turned towards the viewer (convex, so no sorting needed)
  const faces = [
    { n: [0, -1, 0], pts: [[0, 0, H], [L, 0, H], [L, 0, 0], [0, 0, 0]], photo: true },
    { n: [0, 1, 0], pts: [[L, W, H], [0, W, H], [0, W, 0], [L, W, 0]], photo: true },
    { n: [-1, 0, 0], pts: [[0, W, H], [0, 0, H], [0, 0, 0], [0, W, 0]] },
    { n: [1, 0, 0], pts: [[L, 0, H], [L, W, H], [L, W, 0], [L, 0, 0]] },
    { n: [0, 0, 1], pts: [[0, W, H], [L, W, H], [L, 0, H], [0, 0, H]], top: true },
  ];
  const edge = dark ? "rgba(255,255,255,.45)" : "rgba(0,0,0,.4)";
  for (const f of faces) {
    const [nx, ny, nz] = f.n, nyr = nx * sa + ny * ca;
    if (-nyr * ce + nz * se <= 1e-6) continue;
    const pts = f.pts.map(q => P(...q));
    poly(pts);
    g.fillStyle = f.photo ? tok("--img-bg") : f.top ? (dark ? "#3a3a41" : "#f0f0ec") : (dark ? "#2c2c32" : "#dcdcd7");
    g.fill();
    if (f.photo && V3.img) {
      const im = V3.img, ia = im.naturalWidth / im.naturalHeight, fw = L, fh = H;
      let w = fw * 0.94, h = w / ia;
      if (h > fh * 0.94) { h = fh * 0.94; w = h * ia; }
      const u = [(pts[1][0] - pts[0][0]) / fw, (pts[1][1] - pts[0][1]) / fw], v = [(pts[3][0] - pts[0][0]) / fh, (pts[3][1] - pts[0][1]) / fh];
      g.save(); poly(pts); g.clip();
      g.setTransform(dpr * u[0], dpr * u[1], dpr * v[0], dpr * v[1], dpr * pts[0][0], dpr * pts[0][1]);

    }

  }
  if (feet[2] >= boxMid[2]) person();

  // Dimensions on the edges closest to the viewer
  const centre = P(L / 2, W / 2, 0);
  const tag = (a, b, text) => {
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], d = [m[0] - centre[0], m[1] - centre[1]], k = 18 / (Math.hypot(...d) || 1);
    label(m[0] + d[0] * k, m[1] + d[1] * k, text);
  };
  const near = (e1, e2) => (P(...e1[0])[2] + P(...e1[1])[2] >= P(...e2[0])[2] + P(...e2[1])[2] ? e1 : e2);
  const eL = near([[0, 0, 0], [L, 0, 0]], [[0, W, 0], [L, W, 0]]), eW = near([[0, 0, 0], [0, W, 0]], [[L, 0, 0], [L, W, 0]]);
  tag(P(...eL[0]), P(...eL[1]), meters(L));
  tag(P(...eW[0]), P(...eW[1]), meters(W));
  const corners = [[0, 0], [L, 0], [L, W], [0, W]].map(([x, y]) => [P(x, y, 0), P(x, y, H)]).sort((a, b) => a[0][0] - b[0][0]);
  const [b0, t0] = corners[0];
  label(b0[0] - 30, (b0[1] + t0[1]) / 2, meters(H));
}

// ---------- Camera / augmented reality (WebXR) ----------
// Android Chrome with ARCore, on the published https copy: the phone detects the floor and the machine's bounding box
// (plus the use zone) is drawn at real size where the user places it. Minimal WebGL, no libraries.
const AR = { session: null, gl: null, prog: null, bufs: null, hitSource: null, ref: null, hit: null, placed: null, yaw: 0, ui: null };

async function arSupported() {
  try { return !!(navigator.xr && window.isSecureContext && await navigator.xr.isSessionSupported("immersive-ar")); } catch { return false; }
}

// 4x4 column-major matrices
const m4 = {
  mul(a, b) { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; },
  place(x, y, z, yaw) { const c = Math.cos(yaw), s = Math.sin(yaw); return new Float32Array([c, 0, -s, 0, 0, 1, 0, 0, s, 0, c, 0, x, y, z, 1]); },
};

// Geometry in metres, box centred on the origin and standing on the floor (y up); vertices are [x, y, z, r, g, b, a]
function arGeometry(L, W, H, clear) {
  const a = [0.24, 0.39, 0.9], hx = L / 2, hz = W / 2;
  const v = (x, y, z, c, al) => [x, y, z, c[0], c[1], c[2], al];
  const quad = (p, c, al) => [p[0], p[1], p[2], p[0], p[2], p[3]].flatMap(q => v(...q, c, al));
  const box = [
    quad([[-hx, 0, hz], [hx, 0, hz], [hx, H, hz], [-hx, H, hz]], a, 0.32), quad([[hx, 0, -hz], [-hx, 0, -hz], [-hx, H, -hz], [hx, H, -hz]], a, 0.32),
    quad([[-hx, 0, -hz], [-hx, 0, hz], [-hx, H, hz], [-hx, H, -hz]], a, 0.26), quad([[hx, 0, hz], [hx, 0, -hz], [hx, H, -hz], [hx, H, hz]], a, 0.26),
    quad([[-hx, H, hz], [hx, H, hz], [hx, H, -hz], [-hx, H, -hz]], a, 0.4),
  ].flat();
  const corners = [[-hx, -hz], [hx, -hz], [hx, hz], [-hx, hz]];
  const edges = [];
  corners.forEach(([x, z], i) => {
    const [x2, z2] = corners[(i + 1) % 4];
    edges.push(...v(x, 0, z, [1, 1, 1], 1), ...v(x2, 0, z2, [1, 1, 1], 1), ...v(x, H, z, [1, 1, 1], 1), ...v(x2, H, z2, [1, 1, 1], 1), ...v(x, 0, z, [1, 1, 1], 1), ...v(x, H, z, [1, 1, 1], 1));
  });

  const zone = clear ? quad([[-zx, y, zz], [zx, y, zz], [zx, y, -zz], [-zx, y, -zz]], a, 0.18) : [];
  const zoneEdges = clear ? [[-zx, zz], [zx, zz], [zx, -zz], [-zx, -zz]].flatMap(([x, z], i, arr) => [...v(x, y, z, a, 1), ...v(arr[(i + 1) % 4][0], y, arr[(i + 1) % 4][1], a, 1)]) : [];
  const ring = [];
  for (let i = 0; i <= 40; i++) { const t = i / 40 * Math.PI * 2, c = Math.cos(t), s = Math.sin(t); ring.push(...v(c * 0.1, 0.002, s * 0.1, [1, 1, 1], 0.95), ...v(c * 0.13, 0.002, s * 0.13, [1, 1, 1], 0.95)); }
  return { box, edges, zone, zoneEdges, ring };
}

function arInitGL(gl, geo) {
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };

  gl.attachShader(prog, sh(gl.VERTEX_SHADER, "attribute vec3 p;attribute vec4 c;uniform mat4 m;varying vec4 v;void main(){gl_Position=m*vec4(p,1.0);v=c;}"));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, "precision mediump float;varying vec4 v;void main(){gl_FragColor=v;}"));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  const bufs = {};
  for (const [k, data] of Object.entries(geo)) { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW); bufs[k] = { b, n: data.length / 7 }; }
  return { prog, bufs, loc: { p: gl.getAttribLocation(prog, "p"), c: gl.getAttribLocation(prog, "c"), m: gl.getUniformLocation(prog, "m") } };
}

// Draws the scene for one view: viewProj = projection × inverse(camera); model = where the box stands
function arDraw(gl, R, viewProj, model, reticle, ghost) {
  gl.useProgram(R.prog);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.enable(gl.DEPTH_TEST);
  const draw = (k, mode, m) => {
    const B = R.bufs[k]; if (!B || !B.n) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, B.b);
    gl.enableVertexAttribArray(R.loc.p); gl.vertexAttribPointer(R.loc.p, 3, gl.FLOAT, false, 28, 0);
    gl.enableVertexAttribArray(R.loc.c); gl.vertexAttribPointer(R.loc.c, 4, gl.FLOAT, false, 28, 12);
    gl.uniformMatrix4fv(R.loc.m, false, m4.mul(viewProj, m));
    gl.drawArrays(mode, 0, B.n);
  };
  if (reticle) { gl.depthMask(false); draw("ring", gl.TRIANGLE_STRIP, reticle); }
  if (model) {
    gl.depthMask(false);
    draw("zone", gl.TRIANGLES, model); draw("zoneEdges", gl.LINES, model);
    if (!ghost) draw("box", gl.TRIANGLES, model);
    gl.depthMask(true);
    draw("edges", gl.LINES, model);
  }
  gl.depthMask(true);
}

async function startAR() {
  if (!V3 || AR.session) return;
  const { L, W, H, clear, p } = V3;
  const ui = document.createElement("div");
  ui.className = "ar-ui on";
  ui.innerHTML = `
    <div class="ar-top"><b>${esc(p.model)}</b><span>${meters(L)} × ${meters(W)} × ${meters(H)}${clear ? ` · zona de uso ${CLEARANCES.find(c => c[0] === clear)[1]}` : ""}</span></div>
    <div class="ar-msg" id="arMsg">Apunta al suelo y mueve el móvil despacio…</div>
    <div class="ar-bottom">
      <button class="ar-btn" id="arRotL" aria-label="Girar a la izquierda">⟲</button>
      <button class="ar-btn primary" id="arPlace" disabled>Colocar aquí</button>
      <button class="ar-btn" id="arRotR" aria-label="Girar a la derecha">⟳</button>
      <button class="ar-btn" id="arExit">Salir</button>
    </div>`;
  document.body.append(ui);
  ui.addEventListener("beforexrselect", e => e.preventDefault());   // taps on the buttons are not XR "select"
  let session;
  try {
    session = await navigator.xr.requestSession("immersive-ar", { requiredFeatures: ["hit-test"], optionalFeatures: ["dom-overlay"], domOverlay: { root: ui } });
  } catch (e) {
    ui.remove();
    toast("No se pudo abrir la cámara: " + (e && e.message || e), 8000);
    return;
  }
  const canvas = document.createElement("canvas");
  const gl = canvas.getContext("webgl", { xrCompatible: true, alpha: true });
  Object.assign(AR, { session, gl, ui, hit: null, placed: null, yaw: 0 });
  Object.assign(AR, arInitGL(gl, arGeometry(L, W, H, clear)));
  session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
  AR.ref = await session.requestReferenceSpace("local");
  AR.hitSource = await session.requestHitTestSource({ space: await session.requestReferenceSpace("viewer") });

  const msg = t => { const el = ui.querySelector("#arMsg"); el.textContent = t; el.hidden = !t; };
  const placeBtn = ui.querySelector("#arPlace");
  placeBtn.onclick = () => {
    if (AR.placed) { AR.placed = null; placeBtn.textContent = "Colocar aquí"; msg("Apunta donde quieras ponerla."); return; }
    if (!AR.hit) return;
    AR.placed = { ...AR.hit }; placeBtn.textContent = "Mover"; msg("");
  };
  ui.querySelector("#arRotL").onclick = () => { AR.yaw += Math.PI / 12; };
  ui.querySelector("#arRotR").onclick = () => { AR.yaw -= Math.PI / 12; };
  ui.querySelector("#arExit").onclick = () => session.end();
  session.addEventListener("select", () => placeBtn.click());   // without DOM overlay, tapping the screen places/moves
  session.addEventListener("end", () => { AR.hitSource && AR.hitSource.cancel && AR.hitSource.cancel(); ui.remove(); Object.assign(AR, { session: null, gl: null, hitSource: null }); });

    if (!pose) return;
    const hits = xrFrame.getHitTestResults(AR.hitSource);

    }

    }

    const model = at ? m4.place(at.x, at.y, at.z, AR.yaw) : null;
    const reticle = !AR.placed && AR.hit ? m4.place(AR.hit.x, AR.hit.y, AR.hit.z, 0) : null;
    for (const view of pose.views) {
      const vp = layer.getViewport(view);
      gl.viewport(vp.x, vp.y, vp.width, vp.height);
      arDraw(gl, AR, m4.mul(view.projectionMatrix, view.transform.inverse.matrix), model, reticle, !AR.placed);
    }
  };
  session.requestAnimationFrame(frame);
}

async function setupARButton() {
  const btn = $("arBtn"), hint = $("arHint");
  if (!btn) return;
  const ok = await arSupported();
  if (!$("arBtn")) return;
  btn.hidden = !ok;
  hint.hidden = ok;
}

function vmLoadImages() {
